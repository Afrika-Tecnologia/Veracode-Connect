name: Lint GitHub Actions

on:
  push:
    branches: [ main ]
    paths:
      - 'action.yml'
      - 'internal/**/action.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'action.yml'
      - 'internal/**/action.yml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Instalar actionlint (versão e script fixados por SHA)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SCRIPT_SHA: '914e7df21a07ef503a81201c76d2b11c789d3fca' # v1.7.12
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_SCRIPT_SHA}/scripts/download-actionlint.bash" \
            | bash -s -- "${ACTIONLINT_VERSION}"

      - name: Lint workflows
        run: ./actionlint -color .github/workflows/*.yml
