name: Create GitHub Release

# O release com as notas completas é criado pelo mantenedor logo após as tags.
# Este workflow é o fallback: se o release da tag ainda não existir, cria com a seção do CHANGELOG.md.
on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Criar release a partir do CHANGELOG (se ainda não existir)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; nada a fazer."
            exit 0
          fi
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Seção [$VERSION] não encontrada no CHANGELOG.md"
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "Veracode Connect $TAG" --notes-file release-notes.md
