name: Testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Versões alinhadas (package.json, package-lock.json, CHANGELOG)
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          LOCK="$(node -p "require('./package-lock.json').version")"
          TOP="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')"
          echo "package.json=$PKG package-lock.json=$LOCK CHANGELOG=$TOP"
          if [ "$PKG" != "$LOCK" ] || [ "$PKG" != "$TOP" ]; then
            echo "::error::Versões divergentes"
            exit 1
          fi

      - name: npm test
        run: npm test
