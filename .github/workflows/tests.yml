name: Testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  BLOCKED_HOSTS: downloads.veracode.com tools.veracode.com download.sourceclear.com sca-downloads.veracode.com repo1.maven.org repo.maven.apache.org

jobs:
  unit:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: npm test
        run: npm test

  # Primeiro job: baixa (ou restaura) as ferramentas UMA vez e prova que os
  # comandos idênticos aos das actions oficiais funcionam com a rede bloqueada.
  toolchain:
    name: Toolchain — ferramentas servidas sem rede
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Preparar ferramentas Veracode
        id: toolchain
        uses: ./internal/toolchain
        with:
          enable_pipelinescan: 'true'
          enable_sca: 'true'
          enable_iac: 'true'

      - name: Conferir ferramentas prontas
        env:
          PIPELINE_READY: ${{ steps.toolchain.outputs.pipeline_ready }}
          CLI_READY: ${{ steps.toolchain.outputs.cli_ready }}
          SCA_READY: ${{ steps.toolchain.outputs.sca_ready }}
          SHIMS: ${{ steps.toolchain.outputs.shims_installed }}
        run: |
          set -euo pipefail
          test "${PIPELINE_READY}" = "true"
          test "${CLI_READY}" = "true"
          test "${SCA_READY}" = "true"
          test "${SHIMS}" = "true"
          test -x "${VERACODE_CONNECT_CLI}"

      - name: Bloquear hosts da Veracode e do Maven Central
        run: |
          set -euo pipefail
          for host in ${BLOCKED_HOSTS}; do
            echo "0.0.0.0 ${host}" | sudo tee -a /etc/hosts >/dev/null
          done
          if /usr/bin/curl -fsS --max-time 10 -o /dev/null https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip; then
            echo "::error::bloqueio de rede não funcionou"
            exit 1
          fi

      - name: Pipeline Scan (comando do upstream, 3 slots)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pipeline" && cd "${RUNNER_TEMP}/pipeline"
          for slot in 1 2 3; do
            curl -sSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
            unzip -o pipeline-scan-LATEST.zip
          done
          test -s pipeline-scan.jar

      - name: IaC (instalador do upstream)
        run: |
          set -euo pipefail
          cd ..;mkdir veracode-cli; cd veracode-cli; curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          cd "${GITHUB_WORKSPACE}"
          ../veracode-cli/veracode version

      - name: SCA (ci.sh do upstream, sem scan)
        run: |
          set -euo pipefail
          curl -sSL https://download.sourceclear.com/ci.sh | NOSCAN=1 sh -s -- scan
          find "${RUNNER_TEMP}/veracode-connect-tools/sca" -path '*/srcclr/bin/srcclr' -type f | grep -q .

      - name: Conferir que tudo veio do cache local
        env:
          SHIM_DIR: ${{ steps.toolchain.outputs.shim_dir }}
        run: |
          set -euo pipefail
          cat "${SHIM_DIR}/served.log"
          test "$(wc -l < "${SHIM_DIR}/served.log")" -ge 6

  # Segundo job: precisa restaurar tudo do actions/cache salvo pelo primeiro.
  toolchain-cache-hit:
    name: Toolchain — reutiliza o actions/cache
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bloquear hosts da Veracode e do Maven Central
        run: |
          set -euo pipefail
          for host in ${BLOCKED_HOSTS}; do
            echo "0.0.0.0 ${host}" | sudo tee -a /etc/hosts >/dev/null
          done

      - name: Preparar ferramentas Veracode (rede bloqueada)
        id: toolchain
        uses: ./internal/toolchain
        with:
          enable_pipelinescan: 'true'
          enable_sca: 'true'
          enable_iac: 'true'

      - name: Conferir cache-hit e uso sem rede
        env:
          PIPELINE_HIT: ${{ steps.toolchain.outputs.pipeline_cache_hit }}
          CLI_HIT: ${{ steps.toolchain.outputs.cli_cache_hit }}
          SCA_HIT: ${{ steps.toolchain.outputs.sca_cache_hit }}
        run: |
          set -euo pipefail
          test "${PIPELINE_HIT}" = "true"
          test "${CLI_HIT}" = "true"
          test "${SCA_HIT}" = "true"
          cd "${RUNNER_TEMP}"
          curl -sSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip -l pipeline-scan-LATEST.zip | grep -q pipeline-scan.jar
          "${VERACODE_CONNECT_CLI}" version

  dependencies:
    name: Dependências Maven — popula o cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restaurar cache de dependências
        id: deps
        uses: ./internal/dependency-cache
        with:
          mode: restore

      - name: Resolver dependências do fixture
        run: mvn -B -q -f .github/fixtures/maven-sample/pom.xml dependency:resolve

      - name: Salvar cache de dependências
        uses: ./internal/dependency-cache
        with:
          mode: save
          key: ${{ steps.deps.outputs.key }}
          cache_hit: ${{ steps.deps.outputs.cache_hit }}
          settings_created: ${{ steps.deps.outputs.settings_created }}

  dependencies-cache-hit:
    name: Dependências Maven — resolve offline do cache
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restaurar cache de dependências
        id: deps
        uses: ./internal/dependency-cache
        with:
          mode: restore

      - name: Bloquear Maven Central e resolver offline
        env:
          CACHE_HIT: ${{ steps.deps.outputs.cache_hit }}
        run: |
          set -euo pipefail
          test "${CACHE_HIT}" = "true"
          for host in ${BLOCKED_HOSTS}; do
            echo "0.0.0.0 ${host}" | sudo tee -a /etc/hosts >/dev/null
          done
          mvn -B -q -o -f .github/fixtures/maven-sample/pom.xml dependency:resolve
          test -f ~/.m2/repository/org/slf4j/slf4j-api/2.0.16/slf4j-api-2.0.16.jar

      - name: Mirror Maven gera e remove settings.xml temporário
        run: |
          set -euo pipefail
          test ! -f ~/.m2/settings.xml
          MAVEN_MIRROR_URL=https://nexus.example.com/repository/maven-public/ node internal/dependency-cache/maven-settings.js write
          grep -q '<mirrorOf>central</mirrorOf>' ~/.m2/settings.xml
          node internal/dependency-cache/maven-settings.js cleanup
          test ! -f ~/.m2/settings.xml
