name: 'Veracode Connect'
description: 'Orquestra integrações do Veracode (Pipeline Scan, Upload & Scan, SCA, IaC/Secrets) com baseline via Portal Afrika ou repositório GitHub. Requer permissions: contents: read; com create_issues: true também issues: write'
author: 'Afrika-Tecnologia'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  portal_afrika_api_key:
    description: 'API Key usada no header X-API-Key do Portal Afrika (GET baseline e POST upload).'
    required: false
  portal_afrika_base_url:
    description: 'URL base do Portal Afrika (sem barra final).'
    required: false
    default: 'https://www.bantuu.io'
  enable_sca:
    description: 'Ativa/desativa o Veracode SCA (true/false).'
    required: false
    default: 'false'
  veracode_sca_token:
    description: 'Token de API do Veracode SCA (usado quando enable_sca = true).'
    required: false
  enable_iac:
    description: 'Ativa/desativa o Veracode IaC/Secrets (directory scan) (true/false).'
    required: false
    default: 'false'
  enable_pipelinescan:
    description: 'Ativa/desativa o Veracode Pipeline Scan quando baseline_mode=none (true/false).'
    required: false
    default: 'true'
  enable_upload_scan:
    description: 'Ativa/desativa o Veracode Upload & Scan (true/false).'
    required: false
    default: 'false'
  baseline_mode:
    description: 'Provedor de baseline: none | portal_afrika (Portal Afrika) | repo. Default none (Pipeline Scan sem baseline provider).'
    required: false
    default: 'none'
  baseline_org:
    description: 'Organização dona do repositório de baseline (obrigatório quando baseline_mode=repo). A org deve conter o repo fixo Afrika-Veracode-Connect-Baseline.'
    required: false
    default: ''
  baseline_github_app_id:
    description: 'GitHub App ID (modo repo). Preferencial ao PAT.'
    required: false
    default: ''
  baseline_github_app_private_key:
    description: 'Private key PEM do GitHub App (modo repo).'
    required: false
    default: ''
  baseline_github_app_installation_id:
    description: 'Installation ID do GitHub App na org do baseline (modo repo).'
    required: false
    default: ''
  baseline_github_token:
    description: 'PAT fallback com contents:read/write no repo de baseline (modo repo).'
    required: false
    default: ''
  enable_auto_packager:
    description: 'Ativa/desativa o uso do Veracode Auto Packager antes do scan (true/false).'
    required: false
    default: 'false'
  veracode_api_id:
    description: 'ID da API do Veracode.'
    required: true
  veracode_api_key:
    description: 'Key da API do Veracode.'
    required: true
  veracode_sandbox:
    description: 'Upload & Scan: sandbox (true), app principal (false) ou omitido/vazio (auto — default branch sem sandbox, demais branches com sandbox).'
    required: false
    default: ''
  scan_file:
    description: 'Arquivo compactado enviado ao Pipeline Scan (ex.: app.zip). Usado quando o auto packager está desativado.'
    required: false
  policy_fail:
    description: 'Define se o scan deve quebrar o build por policy (true/false).'
    required: false
    default: 'false'
  fail_on_severity:
    description: 'Severidades que fazem o scan falhar quando há baseline (ex.: "Very High, High").'
    required: false
  fail_build:
    description: 'Se true, o build falha caso qualquer scan reporte erro. Se false, apenas emite warnings (true/false).'
    required: false
    default: 'true'
  veracode_appname:
    description: 'Nome do app no Veracode.'
    required: false
    default: '${{ github.repository }}'
  veracode_policy_name:
    description: 'Nome da policy a ser usada no scan do Veracode.'
    required: false
    default: ''
  create_issues:
    description: 'Cria/importa issues no GitHub para findings do SCA (create-issues) e do Pipeline Scan (veracode-flaws-to-issues). Default false.'
    required: false
    default: 'false'

outputs:
  baseline_mode:
    description: 'Modo de baseline resolvido (none | portal_afrika | repo).'
    value: ${{ steps.validate.outputs.baseline_mode || 'none' }}
  has_baseline:
    description: 'true/false indicando se existe baseline para o repositório (Portal Afrika ou repo).'
    value: ${{ steps.baseline_flow.outputs.has_baseline || steps.repo_baseline_flow.outputs.has_baseline || 'false' }}
  pipeline_status:
    description: 'Resumo do caminho seguido: com baseline, sem baseline (com upload/seed ou seed pulado fora da default_branch), apenas scan ou pipeline desativado.'
    value: ${{ steps.baseline_flow.outputs.pipeline_status || steps.repo_baseline_flow.outputs.pipeline_status || steps.pipeline_only.outputs.pipeline_status || steps.pipeline_disabled_status.outputs.pipeline_status }}
  repository_full_name:
    description: 'Repositório org/repo usado para baseline e Upload & Scan.'
    value: ${{ steps.resolve_repo.outputs.repository_full_name }}
  sca_status:
    description: 'Resultado do Veracode SCA (success | warning | skipped).'
    value: ${{ steps.veracode_sca.outputs.sca_status || 'skipped' }}
  iac_status:
    description: 'Resultado do Veracode IaC/Secrets (success | failure | skipped).'
    value: ${{ steps.veracode_iac.outputs.iac_status || 'skipped' }}
  upload_scan_status:
    description: 'Resultado do Upload & Scan (success | failure | skipped).'
    value: ${{ steps.upload_and_scan.outcome || 'skipped' }}

runs:
  using: 'composite'
  steps:
    # ── 0a. Resolver platform type (GitHub.com vs GHES) ───────────────
    - name: Resolver platform type
      id: resolve_platform
      uses: Afrika-Tecnologia/Veracode-Connect/internal/resolve-platform-type@v1

    # ── 0b. Gerar ID único para artefatos desta execução ─────────────
    - name: Gerar ID único de scan
      id: scan_id_gen
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Gerar ID único de scan"
        SCAN_ID="${{ github.run_id }}-${{ github.run_attempt }}-${RANDOM}"
        echo "scan_id=${SCAN_ID}" >> "$GITHUB_OUTPUT"
        echo "ID único de scan gerado: \"${SCAN_ID}\""
        echo "::endgroup::"

    # ── 1. Validar inputs ────────────────────────────────────────────
    - name: Validar inputs
      id: validate
      uses: Afrika-Tecnologia/Veracode-Connect/internal/validate-inputs@v1
      with:
        enable_sca: ${{ inputs.enable_sca }}
        veracode_sca_token: ${{ inputs.veracode_sca_token }}
        enable_iac: ${{ inputs.enable_iac }}
        enable_pipelinescan: ${{ inputs.enable_pipelinescan }}
        baseline_mode: ${{ inputs.baseline_mode }}
        portal_afrika_api_key: ${{ inputs.portal_afrika_api_key }}
        portal_afrika_base_url: ${{ inputs.portal_afrika_base_url }}
        enable_auto_packager: ${{ inputs.enable_auto_packager }}
        scan_file: ${{ inputs.scan_file }}
        enable_upload_scan: ${{ inputs.enable_upload_scan }}
        veracode_api_id: ${{ inputs.veracode_api_id }}
        veracode_api_key: ${{ inputs.veracode_api_key }}
        create_issues: ${{ inputs.create_issues }}
        baseline_org: ${{ inputs.baseline_org }}
        baseline_github_app_id: ${{ inputs.baseline_github_app_id }}
        baseline_github_app_private_key: ${{ inputs.baseline_github_app_private_key }}
        baseline_github_app_installation_id: ${{ inputs.baseline_github_app_installation_id }}
        baseline_github_token: ${{ inputs.baseline_github_token }}

    # ── 2. Veracode SCA ──────────────────────────────────────────────
    - name: Veracode SCA
      id: veracode_sca
      if: inputs.enable_sca == 'true'
      uses: Afrika-Tecnologia/Veracode-Connect/internal/veracode-sca@v1
      with:
        veracode_sca_token: ${{ inputs.veracode_sca_token }}
        artifact_suffix: ${{ steps.scan_id_gen.outputs.scan_id }}
        create_issues: ${{ inputs.create_issues }}
        platform_type: ${{ steps.resolve_platform.outputs.platform_type }}

    # ── 3. Veracode IaC / Secrets ────────────────────────────────────
    - name: Veracode IaC / Secrets
      id: veracode_iac
      if: inputs.enable_iac == 'true'
      uses: Afrika-Tecnologia/Veracode-Connect/internal/veracode-iac@v1
      with:
        veracode_api_id: ${{ inputs.veracode_api_id }}
        veracode_api_key: ${{ inputs.veracode_api_key }}
        artifact_suffix: ${{ steps.scan_id_gen.outputs.scan_id }}

    # ── 4. Preparar scan file (somente se pipeline/upload/baseline precisar) ─
    - name: Preparar scan file
      id: prepare_scan_file
      if: (success() || failure()) && (inputs.enable_pipelinescan == 'true' || inputs.enable_upload_scan == 'true' || steps.validate.outputs.baseline_mode == 'portal_afrika' || steps.validate.outputs.baseline_mode == 'repo')
      uses: Afrika-Tecnologia/Veracode-Connect/internal/auto-packager@v1
      with:
        enable_auto_packager: ${{ inputs.enable_auto_packager }}
        scan_file: ${{ inputs.scan_file }}

    # ── 5. Resolver nome do repositório ──────────────────────────────
    - name: Resolver nome do repositório
      id: resolve_repo
      if: success() || failure()
      uses: Afrika-Tecnologia/Veracode-Connect/internal/resolve-repo@v1

    # ── 6a. Portal Afrika Baseline Flow ─────────────────────────────────────
    - name: Portal Afrika Baseline Flow
      id: baseline_flow
      if: steps.validate.outputs.baseline_mode == 'portal_afrika'
      uses: Afrika-Tecnologia/Veracode-Connect/internal/portal-afrika-baseline-flow@v1
      with:
        portal_afrika_api_key: ${{ inputs.portal_afrika_api_key }}
        portal_afrika_base_url: ${{ inputs.portal_afrika_base_url }}
        repository_full_name: ${{ steps.resolve_repo.outputs.repository_full_name }}
        veracode_api_id: ${{ inputs.veracode_api_id }}
        veracode_api_key: ${{ inputs.veracode_api_key }}
        scan_file: ${{ steps.prepare_scan_file.outputs.scan_file }}
        policy_fail: ${{ inputs.policy_fail }}
        fail_on_severity: ${{ inputs.fail_on_severity }}
        veracode_policy_name: ${{ inputs.veracode_policy_name }}
        artifact_suffix: ${{ steps.scan_id_gen.outputs.scan_id }}
        create_issues: ${{ inputs.create_issues }}
        platform_type: ${{ steps.resolve_platform.outputs.platform_type }}

    # ── 6b. Repo baseline flow ───────────────────────────────────────
    - name: Repo baseline flow
      id: repo_baseline_flow
      if: steps.validate.outputs.baseline_mode == 'repo'
      uses: Afrika-Tecnologia/Veracode-Connect/internal/repo-baseline-flow@v1
      with:
        baseline_org: ${{ inputs.baseline_org }}
        baseline_github_app_id: ${{ inputs.baseline_github_app_id }}
        baseline_github_app_private_key: ${{ inputs.baseline_github_app_private_key }}
        baseline_github_app_installation_id: ${{ inputs.baseline_github_app_installation_id }}
        baseline_github_token: ${{ inputs.baseline_github_token }}
        repository_full_name: ${{ steps.resolve_repo.outputs.repository_full_name }}
        veracode_api_id: ${{ inputs.veracode_api_id }}
        veracode_api_key: ${{ inputs.veracode_api_key }}
        scan_file: ${{ steps.prepare_scan_file.outputs.scan_file }}
        policy_fail: ${{ inputs.policy_fail }}
        fail_on_severity: ${{ inputs.fail_on_severity }}
        veracode_policy_name: ${{ inputs.veracode_policy_name }}
        artifact_suffix: ${{ steps.scan_id_gen.outputs.scan_id }}
        create_issues: ${{ inputs.create_issues }}
        platform_type: ${{ steps.resolve_platform.outputs.platform_type }}

    # ── 6c. Pipeline Scan sem baseline provider ──────────────────────
    - name: Pipeline Scan (sem baseline provider)
      id: pipeline_only
      if: steps.validate.outputs.baseline_mode == 'none' && inputs.enable_pipelinescan == 'true'
      uses: Afrika-Tecnologia/Veracode-Connect/internal/pipeline-only@v1
      with:
        veracode_api_id: ${{ inputs.veracode_api_id }}
        veracode_api_key: ${{ inputs.veracode_api_key }}
        scan_file: ${{ steps.prepare_scan_file.outputs.scan_file }}
        policy_fail: ${{ inputs.policy_fail }}
        veracode_policy_name: ${{ inputs.veracode_policy_name }}
        artifact_suffix: ${{ steps.scan_id_gen.outputs.scan_id }}
        create_issues: ${{ inputs.create_issues }}
        platform_type: ${{ steps.resolve_platform.outputs.platform_type }}

    # ── 6d. Pipeline desativado ──────────────────────────────────────
    - name: Pipeline Scan desativado (definir status)
      id: pipeline_disabled_status
      if: steps.validate.outputs.baseline_mode == 'none' && inputs.enable_pipelinescan != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Pipeline Scan desativado"
        echo "pipeline_status=pipeline_scan_disabled" >> "$GITHUB_OUTPUT"
        echo "Pipeline Scan desativado (enable_pipelinescan != true e baseline_mode=none)."
        echo "Status definido: \"pipeline_scan_disabled\""
        echo "::endgroup::"

    # ── 7. Upload & Scan ─────────────────────────────────────────────
    - name: Veracode Upload & Scan
      id: upload_and_scan
      if: (success() || failure()) && inputs.enable_upload_scan == 'true'
      uses: Afrika-Tecnologia/Veracode-Connect/internal/veracode-upload-scan@v1
      with:
        veracode_api_id: ${{ inputs.veracode_api_id }}
        veracode_api_key: ${{ inputs.veracode_api_key }}
        repository_full_name: ${{ steps.resolve_repo.outputs.repository_full_name }}
        veracode_sandbox: ${{ inputs.veracode_sandbox }}
        filepath: ${{ steps.prepare_scan_file.outputs.scan_file }}
        veracode_appname: ${{ inputs.veracode_appname }}
        platform_type: ${{ steps.resolve_platform.outputs.platform_type }}

    # ── 8. Trava de Build (step final obrigatório) ───────────────────
    - name: Trava de Build (verificação final)
      if: always()
      uses: Afrika-Tecnologia/Veracode-Connect/internal/build-gate@v1
      with:
        fail_build: ${{ inputs.fail_build }}
        sca_status: ${{ steps.veracode_sca.outputs.sca_status || 'skipped' }}
        iac_outcome: ${{ steps.veracode_iac.outcome || 'skipped' }}
        baseline_outcome: ${{ steps.baseline_flow.outcome || 'skipped' }}
        repo_baseline_outcome: ${{ steps.repo_baseline_flow.outcome || 'skipped' }}
        pipeline_outcome: ${{ steps.pipeline_only.outcome || 'skipped' }}
        upload_outcome: ${{ steps.upload_and_scan.outcome || 'skipped' }}
        validate_outcome: ${{ steps.validate.outcome || 'success' }}
        baseline_mode: ${{ steps.validate.outputs.baseline_mode || 'none' }}
