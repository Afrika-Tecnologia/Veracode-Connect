name: 'Auto Packager'
description: 'Prepara os artefatos do Veracode Auto Packager a partir do tree do commit (zips intactos) para Pipeline Scan e Upload & Scan.'

inputs:
  enable_auto_packager:
    description: 'Ativa/desativa o uso do Veracode Auto Packager (true/false).'
    required: false
    default: 'false'
  scan_file:
    description: 'Caminho do artefato ja empacotado quando o auto packager esta desativado.'
    required: false
  cli_version:
    description: 'Versao da Veracode CLI a ser baixada.'
    required: false
    default: '2.51.2'
  cli_cache_key_prefix:
    description: 'Prefixo para a chave de cache da Veracode CLI.'
    required: false
    default: 'veracode-cli'
  pipeline_scan_max_artifacts:
    description: 'Teto de artefatos enviados ao Pipeline Scan (1-6).'
    required: false
    default: '6'

outputs:
  scan_file:
    description: 'Caminho do primeiro artefato scannable (back-compat).'
    value: ${{ steps.final_output.outputs.scan_file }}
  scan_files:
    description: 'JSON array dos artefatos a enviar ao Pipeline Scan.'
    value: ${{ steps.final_output.outputs.scan_files }}
  upload_dir:
    description: 'Diretório plano com cópias byte-idênticas de todos os artefatos (barra final).'
    value: ${{ steps.final_output.outputs.upload_dir }}
  packaged_dir:
    description: 'Diretório original de saída da CLI.'
    value: ${{ steps.final_output.outputs.packaged_dir }}
  artifact_count:
    description: 'Quantidade de artefatos gerados pelo Auto Packager (vazio quando o packager nao rodou).'
    value: ${{ steps.prepare.outputs.artifact_count || '' }}
  scan_count:
    description: 'Quantidade de artefatos selecionados para Pipeline Scan.'
    value: ${{ steps.prepare.outputs.scan_count || '' }}
  skipped_count:
    description: 'Quantidade de artefatos descartados do Pipeline Scan.'
    value: ${{ steps.prepare.outputs.skipped_count || '' }}

runs:
  using: 'composite'
  steps:
    - name: Configurar Cache da Veracode CLI
      id: cli_cache
      if: inputs.enable_auto_packager == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ github.workspace }}/veracode
        key: ${{ inputs.cli_cache_key_prefix }}-${{ inputs.cli_version }}-${{ runner.os }}

    - name: Preparar scan file (Veracode CLI)
      id: prepare
      shell: bash
      env:
        ENABLE: ${{ inputs.enable_auto_packager }}
        INPUT_SCAN_FILE: ${{ inputs.scan_file }}
        CLI_VERSION: ${{ inputs.cli_version }}
        MAX_ARTIFACTS: ${{ inputs.pipeline_scan_max_artifacts }}
        GITHUB_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        if [ "${ENABLE}" = "true" ]; then
          echo "::group::Preparar scan file (Auto Packager)"

          if [ -n "${INPUT_SCAN_FILE:-}" ] && [ -f "${INPUT_SCAN_FILE}" ]; then
            echo "::warning::$(node "$GITHUB_ACTION_PATH/messages.js" warning SCAN_FILE_OVERRIDES_PACKAGER)"
            echo "scan_file=${INPUT_SCAN_FILE}" >> "$GITHUB_OUTPUT"
            echo "scan_files=[\"${INPUT_SCAN_FILE}\"]" >> "$GITHUB_OUTPUT"
            echo "upload_dir=" >> "$GITHUB_OUTPUT"
            echo "packaged_dir=" >> "$GITHUB_OUTPUT"
            echo "artifact_count=1" >> "$GITHUB_OUTPUT"
            echo "scan_count=1" >> "$GITHUB_OUTPUT"
            echo "skipped_count=0" >> "$GITHUB_OUTPUT"
            echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCAN_FILE_SET "file=${INPUT_SCAN_FILE}")"
            echo "::endgroup::"
            exit 0
          fi

          if [ "${{ steps.cli_cache.outputs.cache-hit }}" != "true" ] && ! command -v veracode >/dev/null 2>&1; then
            curl -fsSL --connect-timeout 15 --max-time 60 https://tools.veracode.com/veracode-cli/install | VERACODE_CLI_VERSION="${CLI_VERSION}" sh
          fi

          mkdir -p "${HOME}/.veracode"
          [ -f "${HOME}/.veracode/veracode.yml" ] || touch "${HOME}/.veracode/veracode.yml"

          WORKSPACE="${GITHUB_WORKSPACE:-$PWD}"
          if command -v veracode >/dev/null 2>&1; then
            VERACODE_CMD="$(command -v veracode)"
          elif [ -x "${WORKSPACE}/veracode" ]; then
            VERACODE_CMD="${WORKSPACE}/veracode"
            echo "${WORKSPACE}" >> "$GITHUB_PATH"
          elif [ -x "${PWD}/veracode" ]; then
            VERACODE_CMD="${PWD}/veracode"
            echo "${PWD}" >> "$GITHUB_PATH"
          else
            echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error CLI_NOT_FOUND)"
            echo "::endgroup::"
            exit 1
          fi

          OUTPUT_DIR="${WORKSPACE}/.veracode-connect/packaged"
          UPLOAD_DIR="${WORKSPACE}/.veracode-connect/upload"
          MANIFEST_PATH="${WORKSPACE}/.veracode-connect/artifacts.json"
          PACKAGE_SOURCE="${RUNNER_TEMP:-/tmp}/veracode-connect-auto-pack"
          rm -rf "${OUTPUT_DIR}" "${UPLOAD_DIR}" "${PACKAGE_SOURCE}"
          rm -f "${WORKSPACE}/.veracode-connect/veracode-packager-bundle.zip"
          mkdir -p "${OUTPUT_DIR}" "${PACKAGE_SOURCE}"
          trap 'rm -rf "${PACKAGE_SOURCE}"' EXIT

          if [ ! -e "${WORKSPACE}/.git" ]; then
            echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error GIT_REPO_MISSING)"
            echo "::endgroup::"
            exit 1
          fi

          SHA="${GITHUB_SHA:-}"
          if [ -z "${SHA}" ]; then
            echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error GIT_ARCHIVE_FAILED "sha=")"
            echo "::endgroup::"
            exit 1
          fi

          if ! git -C "${WORKSPACE}" archive "${SHA}" | tar -x -C "${PACKAGE_SOURCE}"; then
            echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error GIT_ARCHIVE_FAILED "sha=${SHA}")"
            echo "::endgroup::"
            exit 1
          fi

          if [ "$(find "${PACKAGE_SOURCE}" -type f | wc -l | tr -d ' ')" = "0" ]; then
            echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error GIT_TREE_EMPTY "sha=${SHA}")"
            echo "::endgroup::"
            exit 1
          fi

          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success CLEAN_TREE_READY "dir=${PACKAGE_SOURCE}" "sha=${SHA}")"

          "${VERACODE_CMD}" version || true

          "${VERACODE_CMD}" package discover "${PACKAGE_SOURCE}" || true
          set +e
          "${VERACODE_CMD}" package --trust --source "${PACKAGE_SOURCE}" --type directory --output "${OUTPUT_DIR}" 2>&1 | tee veracode_package.log
          PACKAGE_EXIT=${PIPESTATUS[0]}
          set -e

          set +e
          node "$GITHUB_ACTION_PATH/classify-artifacts.js" "${OUTPUT_DIR}" "${UPLOAD_DIR}" "${MAX_ARTIFACTS}" "${MANIFEST_PATH}"
          SELECT_EXIT=$?
          set -e

          if [ "${SELECT_EXIT}" -ne 0 ]; then
            if [ "${PACKAGE_EXIT}" -ne 0 ]; then
              echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error PACKAGE_FAILED_NO_ARTIFACTS "code=${PACKAGE_EXIT}")"
            fi
            echo "::endgroup::"
            exit 1
          fi

          if [ "${PACKAGE_EXIT}" -ne 0 ]; then
            echo "::warning::$(node "$GITHUB_ACTION_PATH/messages.js" warning PACKAGE_EXIT_WITH_ARTIFACTS "code=${PACKAGE_EXIT}")"
          fi

          echo "Artefatos gerados pelo Auto Packager:"
          ls -lh "${OUTPUT_DIR}" || true
          echo "Cópia íntegra para Upload & Scan:"
          ls -lh "${UPLOAD_DIR}" || true
          echo "::endgroup::"
        else
          echo "::group::Preparar scan file (arquivo informado)"
          if [ -z "${INPUT_SCAN_FILE}" ]; then
            echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error SCAN_FILE_NOT_PROVIDED)"
            echo "::endgroup::"
            exit 1
          fi

          if [ ! -f "${INPUT_SCAN_FILE}" ]; then
            echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error SCAN_FILE_NOT_FOUND "file=${INPUT_SCAN_FILE}")"
            echo "::endgroup::"
            exit 1
          fi

          echo "scan_file=${INPUT_SCAN_FILE}" >> "$GITHUB_OUTPUT"
          echo "scan_files=[\"${INPUT_SCAN_FILE}\"]" >> "$GITHUB_OUTPUT"
          echo "upload_dir=" >> "$GITHUB_OUTPUT"
          echo "packaged_dir=" >> "$GITHUB_OUTPUT"
          echo "artifact_count=1" >> "$GITHUB_OUTPUT"
          echo "scan_count=1" >> "$GITHUB_OUTPUT"
          echo "skipped_count=0" >> "$GITHUB_OUTPUT"
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCAN_FILE_VALIDATED "file=${INPUT_SCAN_FILE}")"
          echo "::endgroup::"
        fi

    - name: Consolidar Saida
      id: final_output
      shell: bash
      env:
        PREP_FILE: ${{ steps.prepare.outputs.scan_file }}
        PREP_FILES: ${{ steps.prepare.outputs.scan_files }}
        PREP_UPLOAD: ${{ steps.prepare.outputs.upload_dir }}
        PREP_PACKAGED: ${{ steps.prepare.outputs.packaged_dir }}
        PREP_COUNT: ${{ steps.prepare.outputs.artifact_count }}
        PREP_SCAN_COUNT: ${{ steps.prepare.outputs.scan_count }}
        PREP_SKIPPED: ${{ steps.prepare.outputs.skipped_count }}
      run: |
        set -euo pipefail
        echo "::group::Consolidar saída do scan file"
        if [ -z "${PREP_FILE:-}" ]; then
          echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error NO_PACKAGER_ARTIFACTS "dir=.veracode-connect/packaged")"
          echo "::endgroup::"
          exit 1
        fi
        echo "scan_file=${PREP_FILE}" >> "$GITHUB_OUTPUT"
        {
          echo "scan_files<<EOF"
          echo "${PREP_FILES}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "upload_dir=${PREP_UPLOAD}" >> "$GITHUB_OUTPUT"
        echo "packaged_dir=${PREP_PACKAGED}" >> "$GITHUB_OUTPUT"
        echo "artifact_count=${PREP_COUNT}" >> "$GITHUB_OUTPUT"
        echo "scan_count=${PREP_SCAN_COUNT}" >> "$GITHUB_OUTPUT"
        echo "skipped_count=${PREP_SKIPPED}" >> "$GITHUB_OUTPUT"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCAN_FILE_CONSOLIDATED "file=${PREP_FILE}" "source=prepare")"
        echo "::endgroup::"

    - name: Gerar Summary do Auto Packager
      if: inputs.enable_auto_packager == 'true'
      shell: bash
      env:
        SCAN_FILE: ${{ steps.final_output.outputs.scan_file }}
        ARTIFACT_COUNT: ${{ steps.prepare.outputs.artifact_count }}
        SCAN_COUNT: ${{ steps.prepare.outputs.scan_count }}
        SKIPPED_COUNT: ${{ steps.prepare.outputs.skipped_count }}
        UPLOAD_DIR: ${{ steps.final_output.outputs.upload_dir }}
        GITHUB_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        echo "::group::Gerar Summary do Auto Packager"

        FRAG_DIR="${RUNNER_TEMP}/veracode-connect-summary"
        mkdir -p "${FRAG_DIR}"
        MANIFEST="${GITHUB_WORKSPACE}/.veracode-connect/artifacts.json"
        {
          echo "### 📦 Auto Packager"
          echo ""

          if [ -f "${MANIFEST}" ]; then
            echo "| Artefato | Tamanho | Linguagem | Código | Teste | Ruído | Decisão | Motivo |"
            echo "|---|---:|---|---:|---:|---:|---|---|"
            jq -r '.artifacts[] |
              "| `\(.name)` | \(.size) | \(.language // "—") | \(.counts.code) | \(.counts.test) | \(.counts.noise) | \(.decision) | \(.reason) |"' \
              "${MANIFEST}"
            echo ""
            echo "Pipeline Scan: **${SCAN_COUNT:-0}** artefato(s). Upload & Scan recebe **${ARTIFACT_COUNT:-0}** artefato(s) íntegros."
            echo ""
            echo "Origem: tree do commit \`${GITHUB_SHA:-}\` (\`git archive\` em \`\$RUNNER_TEMP\`, não o workspace do job)."
            if [ -n "${SKIPPED_COUNT:-}" ] && [ "${SKIPPED_COUNT}" != "0" ]; then
              echo ""
              echo "> ${SKIPPED_COUNT} artefato(s) ficaram de fora do Pipeline Scan (ruído, redundância ou limite de slots). Os zips originais seguem no diretório de upload."
            fi
          elif [ -n "${SCAN_FILE:-}" ] && [ -f "${SCAN_FILE}" ]; then
            FILE_SIZE=$(du -h "${SCAN_FILE}" | cut -f1)
            FILE_NAME=$(basename "${SCAN_FILE}")
            echo "| Propriedade | Valor |"
            echo "|---|---|"
            echo "| Artefato | \`${FILE_NAME}\` |"
            echo "| Tamanho | ${FILE_SIZE} |"
            echo "| Método | Arquivo informado |"
          else
            echo "> ⚠️ Nenhum artefato gerado pelo Auto Packager."
          fi

          echo ""
        } > "${FRAG_DIR}/packager.md"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SUMMARY_WRITTEN)"
        echo "::endgroup::"
