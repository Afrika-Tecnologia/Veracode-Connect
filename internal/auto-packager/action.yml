name: 'Auto Packager'
description: 'Prepara o artefato a ser enviado ao Veracode Pipeline Scan usando a Veracode CLI (Auto Packager) ou um zip informado.'

inputs:
  enable_auto_packager:
    description: 'Ativa/desativa o uso do Veracode Auto Packager (true/false).'
    required: false
    default: 'false'
  scan_file:
    description: 'Caminho do artefato ja empacotado quando o auto packager esta desativado.'
    required: false
  cli_version:
    description: 'Versao da Veracode CLI a ser baixada.'
    required: false
    default: '2.51.2'
  cli_cache_key_prefix:
    description: 'Prefixo para a chave de cache da Veracode CLI.'
    required: false
    default: 'veracode-cli'

outputs:
  scan_file:
    description: 'Caminho efetivo do arquivo a ser usado no Veracode Pipeline Scan.'
    value: ${{ steps.final_output.outputs.scan_file }}

runs:
  using: 'composite'
  steps:
    - name: Configurar Cache da Veracode CLI
      id: cli_cache
      if: inputs.enable_auto_packager == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ github.workspace }}/veracode
        key: ${{ inputs.cli_cache_key_prefix }}-${{ inputs.cli_version }}-${{ runner.os }}

    - name: Preparar scan file (Veracode CLI)
      id: prepare
      shell: bash
      env:
        ENABLE: ${{ inputs.enable_auto_packager }}
        INPUT_SCAN_FILE: ${{ inputs.scan_file }}
        CLI_VERSION: ${{ inputs.cli_version }}
      run: |
        set -euo pipefail

        if [ "${ENABLE}" = "true" ]; then
          echo "::group::Preparar scan file (Auto Packager)"

          if [ -n "${INPUT_SCAN_FILE:-}" ] && [ -f "${INPUT_SCAN_FILE}" ]; then
            echo "::warning::$(node "$GITHUB_ACTION_PATH/messages.js" warning SCAN_FILE_OVERRIDES_PACKAGER)"
            echo "scan_file=${INPUT_SCAN_FILE}" >> "$GITHUB_OUTPUT"
            echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCAN_FILE_SET "file=${INPUT_SCAN_FILE}")"
            echo "::endgroup::"
            exit 0
          fi

          if [ "${{ steps.cli_cache.outputs.cache-hit }}" != "true" ] && ! command -v veracode >/dev/null 2>&1; then
            curl -fsSL --connect-timeout 15 --max-time 60 https://tools.veracode.com/veracode-cli/install | VERACODE_CLI_VERSION="${CLI_VERSION}" sh
          fi

          mkdir -p "${HOME}/.veracode"
          [ -f "${HOME}/.veracode/veracode.yml" ] || touch "${HOME}/.veracode/veracode.yml"

          WORKSPACE="${GITHUB_WORKSPACE:-$PWD}"
          if command -v veracode >/dev/null 2>&1; then
            VERACODE_CMD="$(command -v veracode)"
          elif [ -x "${WORKSPACE}/veracode" ]; then
            VERACODE_CMD="${WORKSPACE}/veracode"
            echo "${WORKSPACE}" >> "$GITHUB_PATH"
          elif [ -x "${PWD}/veracode" ]; then
            VERACODE_CMD="${PWD}/veracode"
            echo "${PWD}" >> "$GITHUB_PATH"
          else
            echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error CLI_NOT_FOUND)"
            echo "::endgroup::"
            exit 1
          fi

          "${VERACODE_CMD}" version || true

          "${VERACODE_CMD}" package discover . || true
          set +e
          "${VERACODE_CMD}" package --trust --source . --type directory --output . 2>&1 | tee veracode_package.log
          PACKAGE_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "${PACKAGE_EXIT}" -ne 0 ]; then
            echo "::warning::$(node "$GITHUB_ACTION_PATH/messages.js" warning PACKAGE_EXIT_FALLBACK "code=${PACKAGE_EXIT}")"
          fi

          ZIP_FILE="$(sed -n 's/.*Package created: \([^[:space:]]\+\).*/\1/p' veracode_package.log | tail -n 1 || true)"

          if [ -z "${ZIP_FILE:-}" ]; then
            shopt -s nullglob
            zips=( veracode-artifact-*.zip )
            if [ ${#zips[@]} -eq 0 ]; then
              zips=( *.zip )
            fi
            shopt -u nullglob
            if [ ${#zips[@]} -eq 0 ]; then
              echo "::warning::$(node "$GITHUB_ACTION_PATH/messages.js" warning NO_ZIP_FALLBACK)"
              echo "needs_fallback=true" >> "$GITHUB_OUTPUT"
              echo "::endgroup::"
              exit 0
            fi
            ZIP_FILE="${zips[0]}"
          fi

          if [ ! -f "${ZIP_FILE}" ]; then
            echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error PACKAGE_FILE_MISSING "file=${ZIP_FILE}")"
            echo "::endgroup::"
            exit 1
          fi

          TARGET="app.zip"

          if [ "${TARGET}" != "${ZIP_FILE}" ]; then
            cp "${ZIP_FILE}" "${TARGET}"
          fi

          echo "scan_file=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCAN_FILE_PACKAGED "file=${TARGET}" "source=${ZIP_FILE}")"
          ls -lh "${TARGET}" || true
          echo "::endgroup::"
        else
          echo "::group::Preparar scan file (arquivo informado)"
          if [ -z "${INPUT_SCAN_FILE}" ]; then
            echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error SCAN_FILE_NOT_PROVIDED)"
            echo "::endgroup::"
            exit 1
          fi

          if [ ! -f "${INPUT_SCAN_FILE}" ]; then
            echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error SCAN_FILE_NOT_FOUND "file=${INPUT_SCAN_FILE}")"
            echo "::endgroup::"
            exit 1
          fi

          echo "scan_file=${INPUT_SCAN_FILE}" >> "$GITHUB_OUTPUT"
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCAN_FILE_VALIDATED "file=${INPUT_SCAN_FILE}")"
          echo "::endgroup::"
        fi

    - name: Fallback ZIP (zip-release)
      if: steps.prepare.outputs.needs_fallback == 'true'
      uses: TheDoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
      with:
        type: 'zip'
        filename: 'app.zip'
        exclusions: '*.git* /*node_modules/* veracode veracode.exe veracode-cli_* app.zip results.json filtered_results.json baseline.json baseline-response.json veracode_*.log iac-results/* .next/* dist/* build/* target/* .gradle/* __pycache__/* *.pyc *.class coverage/* .cache/* .pytest_cache/* *.log bin/* obj/*'

    - name: Concluir Fallback ZIP
      if: steps.prepare.outputs.needs_fallback == 'true'
      shell: bash
      run: |
        echo "::group::Concluir Fallback ZIP"
        if [ ! -f "app.zip" ]; then
          echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error FALLBACK_ZIP_FAILED)"
          echo "::endgroup::"
          exit 1
        fi
        echo "scan_file=app.zip" >> "$GITHUB_OUTPUT"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success FALLBACK_ZIP_OK)"
        ls -lh app.zip || true
        echo "::endgroup::"
      id: fallback_output

    - name: Consolidar Saida
      id: final_output
      shell: bash
      env:
        PREP_FILE: ${{ steps.prepare.outputs.scan_file }}
        FALL_FILE: ${{ steps.fallback_output.outputs.scan_file }}
      run: |
        set -euo pipefail
        echo "::group::Consolidar saída do scan file"
        if [ -n "${FALL_FILE:-}" ]; then
          echo "scan_file=${FALL_FILE}" >> "$GITHUB_OUTPUT"
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCAN_FILE_CONSOLIDATED "file=${FALL_FILE}" "source=fallback ZIP")"
        else
          echo "scan_file=${PREP_FILE}" >> "$GITHUB_OUTPUT"
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCAN_FILE_CONSOLIDATED "file=${PREP_FILE}" "source=prepare")"
        fi
        echo "::endgroup::"

    - name: Gerar Summary do Auto Packager
      if: inputs.enable_auto_packager == 'true'
      shell: bash
      env:
        SCAN_FILE: ${{ steps.final_output.outputs.scan_file }}
        NEEDS_FALLBACK: ${{ steps.prepare.outputs.needs_fallback }}
      run: |
        set -euo pipefail
        echo "::group::Gerar Summary do Auto Packager"

        {
          echo "### 📦 Auto Packager"
          echo ""

          if [ -n "${SCAN_FILE:-}" ] && [ -f "${SCAN_FILE}" ]; then
            FILE_SIZE=$(du -h "${SCAN_FILE}" | cut -f1)
            FILE_SIZE_BYTES=$(stat -c%s "${SCAN_FILE}" 2>/dev/null || stat -f%z "${SCAN_FILE}" 2>/dev/null || echo "N/A")
            FILE_NAME=$(basename "${SCAN_FILE}")

            METHOD="Veracode CLI"
            if [ "${NEEDS_FALLBACK:-}" = "true" ]; then
              METHOD="Fallback (zip-release)"
            fi

            echo "| Propriedade | Valor |"
            echo "|---|---|"
            echo "| Artefato | \`${FILE_NAME}\` |"
            echo "| Tamanho | ${FILE_SIZE} (${FILE_SIZE_BYTES} bytes) |"
            echo "| Método | ${METHOD} |"
          else
            echo "> ⚠️ Nenhum artefato gerado pelo Auto Packager."
          fi

          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SUMMARY_WRITTEN)"
        echo "::endgroup::"
