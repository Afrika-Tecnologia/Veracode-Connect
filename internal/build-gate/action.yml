name: 'Build Gate'
description: 'Resume os resultados dos scans; o orquestrador aplica o bloqueio no último step.'

inputs:
  veracode_url:
    description: 'Link de acesso à Veracode exibido abaixo do título do Resumo Final.'
    required: false
    default: 'https://analysiscenter.veracode.com/'
  fail_build:
    description: 'Recebe a decisão final do orquestrador de bloquear a esteira (true/false).'
    required: false
    default: 'true'
  sca_status:
    description: 'Status do Veracode SCA.'
    required: false
    default: 'skipped'
  iac_outcome:
    description: 'Outcome do Veracode IaC/Secrets.'
    required: false
    default: 'skipped'
  iac_policy_status:
    description: 'Resultado da política IaC (not_used | passed | failed | error).'
    required: false
    default: 'not_used'
  iac_policy_name:
    description: 'Nome da política IaC selecionada.'
    required: false
    default: ''
  baseline_outcome:
    description: 'Outcome do Portal Afrika Baseline Flow.'
    required: false
    default: 'skipped'
  repo_baseline_outcome:
    description: 'Outcome do Repo Baseline Flow.'
    required: false
    default: 'skipped'
  pipeline_outcome:
    description: 'Outcome do Pipeline Scan (sem provedor de baseline).'
    required: false
    default: 'skipped'
  upload_outcome:
    description: 'Outcome do Upload & Scan.'
    required: false
    default: 'skipped'
  validate_outcome:
    description: 'Outcome do step de validação de inputs (success/failure).'
    required: false
    default: 'success'
  baseline_mode:
    description: 'Modo de baseline resolvido (none | portal_afrika | repo).'
    required: false
    default: 'none'
  sca_scan_url:
    description: 'Mantido por compatibilidade; links de relatório não são exibidos.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Avaliar status final
      id: gate_check
      shell: bash
      env:
        SCA_STATUS: ${{ inputs.sca_status }}
        IAC_OUTCOME: ${{ inputs.iac_outcome }}
        IAC_POLICY_STATUS: ${{ inputs.iac_policy_status }}
        BASELINE_OUTCOME: ${{ inputs.baseline_outcome }}
        REPO_BASELINE_OUTCOME: ${{ inputs.repo_baseline_outcome }}
        PIPELINE_OUTCOME: ${{ inputs.pipeline_outcome }}
        UPLOAD_OUTCOME: ${{ inputs.upload_outcome }}
        VALIDATE_OUTCOME: ${{ inputs.validate_outcome }}
      run: |
        set -euo pipefail

        echo "::group::Trava de Build (verificação final)"

        falhas=()
        alertas=()

        check_status() {
          local name="$1"
          local status="$2"
          if [ "${status}" = "skipped" ]; then
            return 0
          fi
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success STEP_STATUS "name=${name}" "status=${status}")"
          if [[ "${status}" == "failure" || "${status}" == "failed" || "${status}" == "scan_failed"* ]]; then
            falhas+=("${name}")
          elif [ "${status}" = "warning" ]; then
            alertas+=("${name}")
          fi
        }

        if [ "${VALIDATE_OUTCOME}" = "failure" ] || [ "${VALIDATE_OUTCOME}" = "failed" ]; then
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success STEP_STATUS "name=Validação de Inputs" "status=${VALIDATE_OUTCOME}")"
          falhas+=("Validação de Inputs")
        fi

        check_status "Veracode SCA" "${SCA_STATUS}"
        check_status "Veracode IaC/Secrets" "${IAC_OUTCOME}"
        check_status "Portal Afrika Baseline" "${BASELINE_OUTCOME}"
        check_status "Repo Baseline" "${REPO_BASELINE_OUTCOME}"
        check_status "Pipeline Scan" "${PIPELINE_OUTCOME}"
        check_status "Upload & Scan" "${UPLOAD_OUTCOME}"

        if [ ${#alertas[@]} -gt 0 ]; then
          echo ""
          echo "::warning::$(node "$GITHUB_ACTION_PATH/messages.js" warning STEPS_WARNED "steps=${alertas[*]}")"
        fi

        if [ ${#falhas[@]} -gt 0 ]; then
          echo ""
          echo "::warning::$(node "$GITHUB_ACTION_PATH/messages.js" error STEPS_FAILED "steps=${falhas[*]}")"
          echo ""
        else
          echo ""
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success ALL_PASSED)"
        fi
        echo "::endgroup::"

    - name: Gerar Summary Final
      id: final_summary
      if: always()
      shell: bash
      env:
        FAIL_BUILD: ${{ inputs.fail_build }}
        BASELINE_MODE: ${{ inputs.baseline_mode }}
        SCA_STATUS: ${{ inputs.sca_status }}
        IAC_OUTCOME: ${{ inputs.iac_outcome }}
        IAC_POLICY_STATUS: ${{ inputs.iac_policy_status }}
        IAC_POLICY_NAME: ${{ inputs.iac_policy_name }}
        BASELINE_OUTCOME: ${{ inputs.baseline_outcome }}
        REPO_BASELINE_OUTCOME: ${{ inputs.repo_baseline_outcome }}
        PIPELINE_OUTCOME: ${{ inputs.pipeline_outcome }}
        UPLOAD_OUTCOME: ${{ inputs.upload_outcome }}
        VALIDATE_OUTCOME: ${{ inputs.validate_outcome }}
        VERACODE_URL: ${{ inputs.veracode_url }}
      run: |
        set -euo pipefail
        echo "::group::Gerar Summary Final"

        FRAG_DIR="${RUNNER_TEMP}/veracode-connect-summary"
        SUMMARY_ENV="$(mktemp "${RUNNER_TEMP}/veracode-summary-env.XXXXXX")"
        trap 'rm -f -- "${SUMMARY_ENV}"' EXIT
        node "$GITHUB_ACTION_PATH/job-summary.js" consolidate-env > "${SUMMARY_ENV}"
        while IFS= read -r -d '' key && IFS= read -r -d '' value; do
          export "${key}=${value}"
        done < "${SUMMARY_ENV}"
        node "$GITHUB_ACTION_PATH/assemble-summary.js" assemble "${FRAG_DIR}" "$GITHUB_STEP_SUMMARY"

        status_icon() {
          local status="$1"
          case "${status}" in
            success|passed) echo "✅ Success" ;;
            failure|failed|scan_failed*) echo "❌ Failed" ;;
            warning|error) echo "⚠️ Warning" ;;
            skipped|not_used) echo "⏭️ Skipped" ;;
            *)             echo "❓ ${status}" ;;
          esac
        }

        append_row_if_active() {
          local name="$1"
          local status="$2"
          if [ "${status}" = "skipped" ] || [ "${status}" = "not_used" ] || [ -z "${status}" ]; then
            return 0
          fi
          echo "| ${name} | $(status_icon "${status}") |"
        }

        has_failure="false"
        has_warning="false"
        for s in "${VALIDATE_OUTCOME}" "${SCA_STATUS}" "${IAC_OUTCOME}" "${IAC_POLICY_STATUS}" "${BASELINE_OUTCOME}" "${REPO_BASELINE_OUTCOME}" "${PIPELINE_OUTCOME}" "${UPLOAD_OUTCOME}"; do
          if [[ "${s}" == "failure" || "${s}" == "failed" || "${s}" == "scan_failed"* ]]; then
            has_failure="true"
          elif [ "${s}" = "warning" ]; then
            has_warning="true"
          fi
        done

        {
          echo "---"
          echo ""
          echo "## 🛡️ Veracode Connect — Resumo Final"
          echo ""
          node "$GITHUB_ACTION_PATH/access-link.js"
          echo ""

          if [ "${has_failure}" = "true" ] && [ "${FAIL_BUILD}" = "true" ]; then
            if [ "${SCA_STATUS}" = "failure" ]; then
              echo "> ❌ **Build travado por falha do SCA**"
            else
              echo "> ❌ **Build travado por policy**"
            fi
          elif [ "${has_failure}" = "true" ] || [ "${has_warning}" = "true" ]; then
            echo "> ⚠️ **Falhas ou achados registrados; esteira preservada**"
          else
            echo "> ✅ **Todos os checks ativos passaram com sucesso**"
          fi
          echo ""

          echo "| Scan | Status |"
          echo "|---|---|"
          if [ "${VALIDATE_OUTCOME}" = "failure" ] || [ "${VALIDATE_OUTCOME}" = "failed" ]; then
            append_row_if_active "Validação de Inputs" "${VALIDATE_OUTCOME}"
          fi
          append_row_if_active "Veracode SCA" "${SCA_STATUS}"
          append_row_if_active "Veracode IaC/Secrets" "${IAC_OUTCOME}"
          if [ "${IAC_POLICY_STATUS}" != "not_used" ] && [ "${IAC_POLICY_STATUS}" != "skipped" ]; then
            append_row_if_active "Política IaC" "${IAC_POLICY_STATUS}"
          fi
          append_row_if_active "Pipeline Scan (Portal Afrika Baseline)" "${BASELINE_OUTCOME}"
          append_row_if_active "Pipeline Scan (Repo Baseline)" "${REPO_BASELINE_OUTCOME}"
          append_row_if_active "Pipeline Scan" "${PIPELINE_OUTCOME}"
          append_row_if_active "Upload & Scan" "${UPLOAD_OUTCOME}"

          echo ""
          echo "---"
          echo ""
          echo "*Gerado por [Veracode Connect](https://github.com/Afrika-Tecnologia/Veracode-Connect)*"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SUMMARY_WRITTEN)"
        echo "::endgroup::"

    - name: Registrar falha do Summary Final
      if: always() && env.VERACODE_CONNECT_ERROR_LOGS == 'true'
      continue-on-error: true
      shell: bash
      env:
        VC_COMPONENT: build_gate
        VC_STEPS: |
          gate_check=${{ steps.gate_check.outcome }}
          final_summary=${{ steps.final_summary.outcome }}
      run: node "$GITHUB_ACTION_PATH/../error-logs/diagnostics.js" capture
