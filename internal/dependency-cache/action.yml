name: 'Cache de dependências (Maven/Gradle)'
description: 'Restaura/salva ~/.m2 e ~/.gradle entre execuções e, opcionalmente, aponta o Maven para um mirror. SCA e Auto Packager resolvem as dependências do projeto; com cache, só artefatos novos saem para a rede.'

inputs:
  mode:
    description: 'restore (antes do SCA/Auto Packager) | save (depois do Upload & Scan).'
    required: true
  cache_dependencies:
    description: 'Ativa o cache de ~/.m2 e ~/.gradle (true/false).'
    required: false
    default: 'true'
  key:
    description: 'mode=save: chave calculada no restore.'
    required: false
    default: ''
  cache_hit:
    description: 'mode=save: cache-hit do restore (true evita salvar de novo).'
    required: false
    default: 'false'
  settings_created:
    description: 'mode=save: true quando o restore criou o settings.xml temporário (é removido aqui).'
    required: false
    default: 'false'
  maven_mirror_url:
    description: 'mode=restore: URL https de um mirror Maven (Nexus/Artifactory). Vazio não altera a configuração do Maven.'
    required: false
    default: ''
  maven_mirror_of:
    description: 'mode=restore: valor de <mirrorOf> (central por padrão; * redireciona todos os repositórios).'
    required: false
    default: 'central'
  maven_mirror_username:
    description: 'mode=restore: usuário do mirror Maven (opcional).'
    required: false
    default: ''
  maven_mirror_password:
    description: 'mode=restore: senha/token do mirror Maven (opcional).'
    required: false
    default: ''

outputs:
  key:
    description: 'Chave do cache de dependências (vazia quando não há arquivos de build JVM ou o cache está desativado).'
    value: ${{ steps.plan.outputs.key || '' }}
  cache_hit:
    description: 'true quando a chave exata foi restaurada.'
    value: ${{ steps.restore.outputs.cache-hit || 'false' }}
  settings_created:
    description: 'true quando um settings.xml temporário foi criado.'
    value: ${{ steps.settings.outputs.settings_created || 'false' }}

runs:
  using: 'composite'
  steps:
    - name: Calcular chave do cache de dependências
      id: plan
      if: inputs.mode == 'restore' && inputs.cache_dependencies == 'true'
      shell: bash
      env:
        BUILD_HASH: ${{ hashFiles('**/pom.xml', '**/build.gradle', '**/build.gradle.kts', '**/settings.gradle', '**/settings.gradle.kts', '**/gradle/libs.versions.toml', '**/gradle.lockfile', '**/gradle-wrapper.properties', '**/maven-wrapper.properties', '!**/node_modules/**') }}
        KEY_PREFIX: veracode-connect-deps-v1-${{ runner.os }}-
      run: |
        set -euo pipefail
        if [ -z "${BUILD_HASH}" ]; then
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" warning DEPS_NO_BUILD_FILES)"
          echo "key=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        KEY="${KEY_PREFIX}${BUILD_HASH}"
        echo "key=${KEY}" >> "$GITHUB_OUTPUT"
        echo "prefix=${KEY_PREFIX}" >> "$GITHUB_OUTPUT"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success DEPS_KEY "key=${KEY}")"

    - name: Restaurar dependências Maven/Gradle
      id: restore
      if: inputs.mode == 'restore' && steps.plan.outputs.key != ''
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.prefix }}

    - name: Configurar mirror Maven
      id: settings
      if: inputs.mode == 'restore' && inputs.maven_mirror_url != ''
      shell: bash
      env:
        MAVEN_MIRROR_URL: ${{ inputs.maven_mirror_url }}
        MAVEN_MIRROR_OF: ${{ inputs.maven_mirror_of }}
        MAVEN_MIRROR_USERNAME: ${{ inputs.maven_mirror_username }}
        MAVEN_MIRROR_PASSWORD: ${{ inputs.maven_mirror_password }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/maven-settings.js" write

    - name: Salvar dependências Maven/Gradle
      if: inputs.mode == 'save' && inputs.cache_dependencies == 'true' && inputs.key != '' && inputs.cache_hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ inputs.key }}

    - name: Remover settings.xml temporário
      if: always() && inputs.mode == 'save' && inputs.settings_created == 'true'
      shell: bash
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/maven-settings.js" cleanup
