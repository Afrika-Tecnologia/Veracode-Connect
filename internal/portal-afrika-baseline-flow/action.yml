name: 'Portal Afrika Baseline Flow'
description: 'Consulta baseline no Portal Afrika, roda Veracode Pipeline Scan com ou sem baseline, sobe baseline se necessario e publica resultados.'

inputs:
  portal_afrika_api_key:
    description: 'API Key usada no Portal Afrika.'
    required: true
  portal_afrika_base_url:
    description: 'URL base do Portal Afrika (sem barra final).'
    required: true
  repository_full_name:
    description: 'Repositorio org/repo usado nas chamadas ao Portal Afrika.'
    required: true
  veracode_api_id:
    description: 'ID da API do Veracode.'
    required: true
  veracode_api_key:
    description: 'Key da API do Veracode.'
    required: true
  scan_file:
    description: 'Arquivo compactado enviado ao Pipeline Scan (ex.: app.zip).'
    required: true
  policy_fail:
    description: 'Define se o scan deve quebrar o build por policy (true/false).'
    required: false
    default: 'false'
  fail_on_severity:
    description: 'Severidades que fazem o scan falhar quando ha baseline (ex.: "Very High, High").'
    required: false
  veracode_policy_name:
    description: 'Nome da policy a ser usada no scan do Veracode.'
    required: false
    default: ''
  artifact_suffix:
    description: 'Sufixo único para o nome do artefato (evita conflito 409 em jobs paralelos).'
    required: false
    default: ''
  create_issues:
    description: 'Importa flaws do Pipeline Scan como issues no GitHub (true/false).'
    required: false
    default: 'false'
  platform_type:
    description: 'CLOUD (github.com) ou ENTERPRISE (GHES).'
    required: false
    default: 'CLOUD'

outputs:
  has_baseline:
    description: 'true/false indicando se o Portal Afrika possui baseline para o repositorio.'
    value: ${{ steps.check_baseline.outputs.has_baseline }}
  pipeline_status:
    description: 'Resumo do caminho seguido: com baseline ou sem baseline (com upload).'
    value: ${{ steps.pipeline_status_with_baseline.outputs.pipeline_status || steps.pipeline_status_without_baseline.outputs.pipeline_status }}

runs:
  using: 'composite'
  steps:
    - name: Instalar jq (se necessario)
      id: ensure_jq
      shell: bash
      run: |
        set -euo pipefail

        echo "::group::Instalar jq"
        if ! command -v jq >/dev/null 2>&1; then
          sudo apt-get update -y
          sudo apt-get install -y jq
          echo "jq instalado com sucesso: $(jq --version)"
        else
          echo "jq já disponível: $(jq --version) (instalação não necessária)"
        fi
        echo "::endgroup::"

    - name: Consultar baseline no Portal Afrika
      id: check_baseline
      shell: bash
      env:
        PORTAL_AFRIKA_API_KEY: ${{ inputs.portal_afrika_api_key }}
        PORTAL_AFRIKA_BASE_URL: ${{ inputs.portal_afrika_base_url }}
        REPOSITORY_FULL_NAME: ${{ inputs.repository_full_name }}
      run: |
        set -euo pipefail

        echo "::group::Portal Afrika Baseline (consulta)"
        RESPONSE_FILE="baseline-response.json"
        
        REPO_ENCODED=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "${REPOSITORY_FULL_NAME}")

        HTTP_STATUS=$(curl -sS -w "%{http_code}" -o "${RESPONSE_FILE}" \
          --connect-timeout 30 \
          --max-time 120 \
          -H "X-API-Key: ${PORTAL_AFRIKA_API_KEY}" \
          "${PORTAL_AFRIKA_BASE_URL}/api/veracode/baseline?repositoryFullName=${REPO_ENCODED}")

        if [ "${HTTP_STATUS}" -ge 400 ]; then
          echo "::warning::Portal Afrika retornou HTTP ${HTTP_STATUS} ao consultar baseline. Continuando sem baseline."
          echo '{}' > "${RESPONSE_FILE}"
        fi

        if [ ! -s "${RESPONSE_FILE}" ]; then
          echo '{}' > "${RESPONSE_FILE}"
        fi

        HAS_BASELINE=$(jq -r '.hasBaseline // false' "${RESPONSE_FILE}")
        if [ "${HAS_BASELINE}" != "true" ]; then
          HAS_BASELINE="false"
        fi

        echo "has_baseline=${HAS_BASELINE}" >> "$GITHUB_OUTPUT"
        if [ "${HAS_BASELINE}" = "true" ]; then
          echo "Consulta de baseline no Portal Afrika concluída com sucesso: baseline encontrado para \"${REPOSITORY_FULL_NAME}\"."
        else
          echo "Consulta de baseline no Portal Afrika concluída: nenhum baseline para \"${REPOSITORY_FULL_NAME}\" (HTTP ${HTTP_STATUS})."
        fi
        echo "::endgroup::"

    - name: Criar arquivo de baseline local a partir do Portal Afrika
      id: create_local_baseline
      if: steps.check_baseline.outputs.has_baseline == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Criar baseline local a partir do Portal Afrika"
        jq '.results' baseline-response.json > baseline.json
        echo "Baseline local criado com sucesso: \"baseline.json\""
        echo "::endgroup::"

    - name: Rodar Veracode Pipeline Scan com baseline
      id: pipeline_with_baseline
      if: steps.check_baseline.outputs.has_baseline == 'true'
      continue-on-error: true
      uses: veracode/Veracode-pipeline-scan-action@3abab7b7c22fed566017eab5b272de18fd6a170a # v1.0.23
      with:
        vid: ${{ inputs.veracode_api_id }}
        vkey: ${{ inputs.veracode_api_key }}
        file: ${{ inputs.scan_file }}
        token: ${{ github.token }}
        baseline_file: 'baseline.json'
        fail_build: ${{ inputs.policy_fail }}
        fail_on_severity: ${{ inputs.fail_on_severity }}
        json_output: 'true'
        json_output_file: 'results.json'
        veracode_policy_name: ${{ inputs.veracode_policy_name }}
        platformType: ${{ inputs.platform_type }}

    - name: Enviar resultados do scan com baseline para o Portal Afrika
      id: upload_baseline_results
      if: steps.check_baseline.outputs.has_baseline == 'true'
      shell: bash
      env:
        PORTAL_AFRIKA_API_KEY: ${{ inputs.portal_afrika_api_key }}
        PORTAL_AFRIKA_BASE_URL: ${{ inputs.portal_afrika_base_url }}
        REPOSITORY_FULL_NAME: ${{ inputs.repository_full_name }}
      run: |
        set -euo pipefail

        echo "::group::Portal Afrika Baseline (upload resultado com baseline)"
        if [ ! -f "results.json" ]; then
          echo "::warning::results.json não encontrado após o Pipeline Scan com baseline. Pulando upload."
          echo "Upload de resultado com baseline: ignorado (results.json ausente)."
          echo "::endgroup::"
          exit 0
        fi

        REPO_ENCODED=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "${REPOSITORY_FULL_NAME}")

        HTTP_STATUS=$(curl -sS -w "%{http_code}" -o /tmp/portal-afrika-upload-response.txt \
          --connect-timeout 30 \
          --max-time 120 \
          -X POST "${PORTAL_AFRIKA_BASE_URL}/api/veracode/baselineupload?repositoryFullName=${REPO_ENCODED}" \
          -H "Content-Type: application/json" \
          -H "X-API-Key: ${PORTAL_AFRIKA_API_KEY}" \
          --data-binary @results.json)

        if [ "${HTTP_STATUS}" -ge 400 ]; then
          echo "::warning::Falha ao enviar resultados com baseline para o Portal Afrika (HTTP ${HTTP_STATUS}). O job continua."
          echo "Upload de resultado com baseline: falhou (HTTP ${HTTP_STATUS}), job segue."
        else
          echo "Upload de resultado com baseline concluído com sucesso (HTTP ${HTTP_STATUS})."
        fi
        rm -f /tmp/portal-afrika-upload-response.txt
        echo "::endgroup::"

    - name: Rodar Veracode Pipeline Scan sem baseline
      id: pipeline_without_baseline
      if: steps.check_baseline.outputs.has_baseline == 'false'
      continue-on-error: true
      uses: veracode/Veracode-pipeline-scan-action@3abab7b7c22fed566017eab5b272de18fd6a170a # v1.0.23
      with:
        vid: ${{ inputs.veracode_api_id }}
        vkey: ${{ inputs.veracode_api_key }}
        file: ${{ inputs.scan_file }}
        token: ${{ github.token }}
        fail_build: ${{ inputs.policy_fail }}
        json_output: 'true'
        json_output_file: 'results.json'
        veracode_policy_name: ${{ inputs.veracode_policy_name }}
        platformType: ${{ inputs.platform_type }}

    - name: Calcular nome do artefato Pipeline Scan
      id: artifact_name
      if: steps.pipeline_with_baseline.outcome != 'skipped' || steps.pipeline_without_baseline.outcome != 'skipped'
      shell: bash
      env:
        SUFFIX: ${{ inputs.artifact_suffix }}
      run: |
        set -euo pipefail
        echo "::group::Calcular nome do artefato Pipeline Scan"
        if [ -n "${SUFFIX}" ]; then
          ARTIFACT_NAME="pipescan-results-${SUFFIX}"
        else
          ARTIFACT_NAME="pipescan-results"
        fi
        echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
        echo "Nome do artefato Pipeline Scan definido: \"${ARTIFACT_NAME}\""
        echo "::endgroup::"

    - name: Upload artefato Pipeline Scan
      if: steps.pipeline_with_baseline.outcome != 'skipped' || steps.pipeline_without_baseline.outcome != 'skipped'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.artifact_name.outputs.name }}
        path: |
          results.json
          filtered_results.json
        if-no-files-found: warn
        retention-days: 3

    - name: Resolver elegibilidade do seed de baseline
      id: seed_gate
      if: steps.check_baseline.outputs.has_baseline == 'false'
      shell: bash
      env:
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        echo "::group::Resolver elegibilidade do seed de baseline"

        branch="${HEAD_REF:-$REF_NAME}"
        if [ -z "${branch}" ]; then
          branch="unknown"
        fi
        default_branch="${DEFAULT_BRANCH:-main}"

        echo "current_branch=${branch}" >> "$GITHUB_OUTPUT"
        echo "default_branch=${default_branch}" >> "$GITHUB_OUTPUT"

        if [ "${branch}" = "${default_branch}" ]; then
          echo "can_seed=true" >> "$GITHUB_OUTPUT"
          echo "Seed de baseline elegível: branch atual \"${branch}\" é a default_branch."
        else
          echo "can_seed=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Sem baseline e a execução não está na default_branch (\"${default_branch}\"). O Pipeline Scan segue sem baseline e o seed NÃO será enviado ao Portal Afrika. Rode na default_branch para criar o baseline."
          echo "Seed de baseline bloqueado: branch atual \"${branch}\" ≠ default \"${default_branch}\"."
        fi
        echo "::endgroup::"

    - name: Enviar resultados para o Portal Afrika (novo baseline)
      id: upload_results
      if: steps.check_baseline.outputs.has_baseline == 'false' && steps.seed_gate.outputs.can_seed == 'true'
      shell: bash
      env:
        PORTAL_AFRIKA_API_KEY: ${{ inputs.portal_afrika_api_key }}
        PORTAL_AFRIKA_BASE_URL: ${{ inputs.portal_afrika_base_url }}
        REPOSITORY_FULL_NAME: ${{ inputs.repository_full_name }}
      run: |
        set -euo pipefail

        echo "::group::Portal Afrika Baseline (upload)"
        if [ ! -f "results.json" ]; then
          echo "::error::Falha ao enviar baseline para o Portal Afrika: results.json não encontrado após o Pipeline Scan."
          echo "::endgroup::"
          exit 1
        fi

        jq -c --arg repo "${REPOSITORY_FULL_NAME}" \
          '. as $scan | {repositoryFullName: $repo, scanResult: $scan}' results.json > payload.json

        HTTP_STATUS=$(curl -sS -w "%{http_code}" -o /tmp/portal-afrika-upload-response.txt \
          --connect-timeout 30 \
          --max-time 120 \
          -X POST "${PORTAL_AFRIKA_BASE_URL}/api/veracode/stock-issues/upload" \
          -H "Content-Type: application/json" \
          -H "X-API-Key: ${PORTAL_AFRIKA_API_KEY}" \
          --data-binary @payload.json)

        if [ "${HTTP_STATUS}" -ge 400 ]; then
          echo "::error::Falha ao enviar baseline para Portal Afrika (HTTP ${HTTP_STATUS}). Verifique as credenciais."
          echo "::error::Resposta do Portal Afrika: $(cat /tmp/portal-afrika-upload-response.txt 2>/dev/null || echo '(vazia)')"
          rm -f /tmp/portal-afrika-upload-response.txt payload.json
          echo "::endgroup::"
          exit 1
        fi
        rm -f /tmp/portal-afrika-upload-response.txt payload.json
        echo "Novo baseline enviado ao Portal Afrika com sucesso (HTTP ${HTTP_STATUS}) para \"${REPOSITORY_FULL_NAME}\"."
        echo "::endgroup::"

    - name: Definir status (com baseline)
      id: pipeline_status_with_baseline
      if: steps.check_baseline.outputs.has_baseline == 'true'
      shell: bash
      env:
        OUTCOME: ${{ steps.pipeline_with_baseline.outcome }}
      run: |
        set -euo pipefail
        echo "::group::Definir status do Pipeline Scan (com baseline)"
        if [ "${OUTCOME}" = "failure" ]; then
          echo "pipeline_status=scan_failed_with_baseline" >> "$GITHUB_OUTPUT"
          echo "Status do Pipeline Scan definido: \"scan_failed_with_baseline\""
        else
          echo "pipeline_status=scan_completed_with_baseline" >> "$GITHUB_OUTPUT"
          echo "Status do Pipeline Scan definido: \"scan_completed_with_baseline\""
        fi
        echo "::endgroup::"

    - name: Definir status (sem baseline, baseline enviado)
      id: pipeline_status_without_baseline
      if: steps.check_baseline.outputs.has_baseline == 'false'
      shell: bash
      env:
        OUTCOME: ${{ steps.pipeline_without_baseline.outcome }}
        CAN_SEED: ${{ steps.seed_gate.outputs.can_seed }}
      run: |
        set -euo pipefail
        echo "::group::Definir status do Pipeline Scan (sem baseline)"
        if [ "${CAN_SEED}" = "true" ]; then
          if [ "${OUTCOME}" = "failure" ]; then
            echo "pipeline_status=scan_failed_without_baseline_and_uploaded" >> "$GITHUB_OUTPUT"
            echo "Status do Pipeline Scan definido: \"scan_failed_without_baseline_and_uploaded\""
          else
            echo "pipeline_status=scan_completed_without_baseline_and_uploaded" >> "$GITHUB_OUTPUT"
            echo "Status do Pipeline Scan definido: \"scan_completed_without_baseline_and_uploaded\""
          fi
        else
          if [ "${OUTCOME}" = "failure" ]; then
            echo "pipeline_status=scan_failed_without_baseline" >> "$GITHUB_OUTPUT"
            echo "Status do Pipeline Scan definido: \"scan_failed_without_baseline\" (seed pulado — fora da default_branch)"
          else
            echo "pipeline_status=scan_completed_without_baseline" >> "$GITHUB_OUTPUT"
            echo "Status do Pipeline Scan definido: \"scan_completed_without_baseline\" (seed pulado — fora da default_branch)"
          fi
        fi
        echo "::endgroup::"

    - name: Verificar resultado do Pipeline Scan (policy_fail)
      if: steps.pipeline_with_baseline.outcome != 'skipped' || steps.pipeline_without_baseline.outcome != 'skipped'
      shell: bash
      env:
        POLICY_FAIL: ${{ inputs.policy_fail }}
        WITH_BASELINE_OUTCOME: ${{ steps.pipeline_with_baseline.outcome }}
        WITHOUT_BASELINE_OUTCOME: ${{ steps.pipeline_without_baseline.outcome }}
      run: |
        set -euo pipefail

        echo "::group::Verificar resultado do Pipeline Scan (policy_fail)"
        if [ ! -f "results.json" ]; then
          echo "::error::Falha na verificação do Pipeline Scan: results.json não encontrado após o scan."
          echo "::endgroup::"
          exit 1
        fi

        outcome="skipped"
        for o in "${WITH_BASELINE_OUTCOME}" "${WITHOUT_BASELINE_OUTCOME}"; do
          if [ -n "${o}" ] && [ "${o}" != "skipped" ] && [ "${o}" != "cancelled" ]; then
            outcome="${o}"
            break
          fi
        done

        if [ "${outcome}" = "failure" ]; then
          if [ "${POLICY_FAIL}" = "true" ]; then
            echo "::error::Pipeline Scan falhou e policy_fail=true — o job será interrompido."
            echo "::endgroup::"
            exit 1
          else
            echo "::warning::Pipeline Scan reportou falhas, mas policy_fail=false (o job continua)."
            echo "Verificação policy_fail concluída: falhas presentes, mas o job segue."
          fi
        else
          echo "Verificação policy_fail concluída com sucesso: Pipeline Scan sem falha de policy."
        fi
        echo "::endgroup::"

    - name: Verificar filtered_results para import de issues
      id: check_filtered_results
      if: inputs.create_issues == 'true' && (steps.pipeline_with_baseline.outcome != 'skipped' || steps.pipeline_without_baseline.outcome != 'skipped')
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Verificar filtered_results para import de issues"
        if [ -f "filtered_results.json" ]; then
          echo "has_filtered=true" >> "$GITHUB_OUTPUT"
          echo "Arquivo filtered_results.json encontrado — import de issues será executado."
        else
          echo "::warning::filtered_results.json não encontrado; import de issues do Pipeline Scan ignorado."
          echo "has_filtered=false" >> "$GITHUB_OUTPUT"
          echo "Import de issues do Pipeline Scan: ignorado (arquivo ausente)."
        fi
        echo "::endgroup::"

    - name: Importar flaws do Pipeline Scan como issues
      id: pipeline_issues
      if: inputs.create_issues == 'true' && steps.check_filtered_results.outputs.has_filtered == 'true'
      uses: veracode/veracode-flaws-to-issues@9261309141b9a0237063aa495800cd05558fffb6 # v2.2.26
      with:
        scan-results-json: filtered_results.json
        github-token: ${{ github.token }}
        fail_build: 'false'

    - name: Gerar Summary do Baseline Pipeline Scan
      if: always() && (steps.pipeline_with_baseline.outcome != 'skipped' || steps.pipeline_without_baseline.outcome != 'skipped')
      shell: bash
      env:
        HAS_BASELINE: ${{ steps.check_baseline.outputs.has_baseline }}
        WITH_BASELINE_OUTCOME: ${{ steps.pipeline_with_baseline.outcome }}
        WITHOUT_BASELINE_OUTCOME: ${{ steps.pipeline_without_baseline.outcome }}
        CREATE_ISSUES: ${{ inputs.create_issues }}
        CAN_SEED: ${{ steps.seed_gate.outputs.can_seed }}
        CURRENT_BRANCH: ${{ steps.seed_gate.outputs.current_branch }}
        DEFAULT_BRANCH: ${{ steps.seed_gate.outputs.default_branch }}
      run: |
        set -euo pipefail
        echo "::group::Gerar Summary do Baseline Pipeline Scan"

        # Determinar outcome efetivo
        OUTCOME="skipped"
        for o in "${WITH_BASELINE_OUTCOME}" "${WITHOUT_BASELINE_OUTCOME}"; do
          if [ -n "${o}" ] && [ "${o}" != "skipped" ] && [ "${o}" != "cancelled" ]; then
            OUTCOME="${o}"
            break
          fi
        done

        {
          echo "### 🔬 Veracode Pipeline Scan (Portal Afrika Baseline)"
          echo ""

          if [ "${HAS_BASELINE}" = "true" ]; then
            echo "> 📁 Baseline encontrado no Portal Afrika — scan executado **com baseline**"
          elif [ "${CAN_SEED}" = "true" ]; then
            echo "> 🆕 Sem baseline no Portal Afrika — scan executado **sem baseline** (baseline enviado após scan na default_branch \`${DEFAULT_BRANCH}\`)"
          else
            echo "> ⚠️ Sem baseline no Portal Afrika — scan executado **sem baseline** e seed **não enviado** (branch \`${CURRENT_BRANCH}\` ≠ default_branch \`${DEFAULT_BRANCH}\`). Rode na default_branch para criar o baseline."
          fi
          if [ "${CREATE_ISSUES}" = "true" ]; then
            echo "> 📝 Issues GitHub: **habilitado** (\`create_issues: true\` — via \`veracode-flaws-to-issues\`)"
          fi
          echo ""

          if [ -f "results.json" ]; then
            TOTAL=$(jq '.findings | length' results.json 2>/dev/null || echo "0")
            VERY_HIGH=$(jq '[.findings[] | select(.severity == 5)] | length' results.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.findings[] | select(.severity == 4)] | length' results.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.findings[] | select(.severity == 3)] | length' results.json 2>/dev/null || echo "0")
            LOW=$(jq '[.findings[] | select(.severity <= 2)] | length' results.json 2>/dev/null || echo "0")

            echo "| Severidade | Quantidade |"
            echo "|---|---|"
            echo "| 🔴 Very High | ${VERY_HIGH} |"
            echo "| 🟠 High | ${HIGH} |"
            echo "| 🟡 Medium | ${MEDIUM} |"
            echo "| 🔵 Low / Very Low | ${LOW} |"
            echo "| **Total** | **${TOTAL}** |"
            echo ""

            # Mostrar tabela com filtragem se existe filtered_results.json
            if [ -f "filtered_results.json" ] && [ "${HAS_BASELINE}" = "true" ]; then
              FILTERED_TOTAL=$(jq '.findings | length' filtered_results.json 2>/dev/null || echo "0")
              if [ "${FILTERED_TOTAL}" != "0" ] && [ "${FILTERED_TOTAL}" != "null" ]; then
                echo "> 🆕 **${FILTERED_TOTAL}** vulnerabilidades novas (não presentes no baseline)"
                echo ""
              fi
            fi

            if [ "${TOTAL}" != "0" ] && [ "${TOTAL}" != "null" ]; then
              echo "<details><summary>📋 Detalhes das vulnerabilidades (${TOTAL})</summary>"
              echo ""
              echo "| # | Severidade | CWE | Título | Arquivo | Linha |"
              echo "|---|---|---|---|---|---|"

              jq -r '.findings | sort_by(-.severity) | to_entries[] |
                def sev_icon:
                  if . == 5 then "🔴 Very High"
                  elif . == 4 then "🟠 High"
                  elif . == 3 then "🟡 Medium"
                  elif . == 2 then "🔵 Low"
                  elif . == 1 then "⚪ Very Low"
                  else "ℹ️ Info" end;
                "| \(.key + 1) | \(.value.severity | sev_icon) | CWE-\(.value.cwe_id) | \(.value.title // "N/A") | \(.value.files.source_file.file // "N/A") | \(.value.files.source_file.line // "N/A") |"' results.json 2>/dev/null || echo "| - | - | - | Erro ao parsear | - | - |"

              echo ""
              echo "</details>"
            fi
          else
            echo "> ⚠️ Arquivo results.json não encontrado."
          fi

          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        echo "Summary do Portal Afrika Baseline Pipeline Scan gerado com sucesso."
        echo "::endgroup::"
