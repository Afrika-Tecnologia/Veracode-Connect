name: 'Resolver nome do repositório'
description: 'Resolve o nome completo do repositório (org/repo) a partir do contexto do GitHub.'

outputs:
  repository_full_name:
    description: 'Repositório no formato org/repo.'
    value: ${{ steps.resolve.outputs.repository_full_name }}

runs:
  using: 'composite'
  steps:
    - name: Resolver nome do repositório
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        echo "::group::Resolver nome do repositório"
        REPO="${GITHUB_REPOSITORY:-}"

        if [ -z "${REPO}" ]; then
          echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error REPO_UNDEFINED)"
          echo "::endgroup::"
          exit 1
        fi

        echo "repository_full_name=${REPO}" >> "$GITHUB_OUTPUT"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success REPO_RESOLVED "repo=${REPO}")"
        echo "::endgroup::"

    - name: Registrar falha do repositório
      if: always() && env.VERACODE_CONNECT_ERROR_LOGS == 'true'
      continue-on-error: true
      shell: bash
      env:
        VC_COMPONENT: resolve_repo
        VC_STEPS: 'resolve=${{ steps.resolve.outcome }}'
      run: node "$GITHUB_ACTION_PATH/../error-logs/diagnostics.js" capture
