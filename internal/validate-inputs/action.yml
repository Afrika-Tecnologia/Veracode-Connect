name: 'Validar inputs'
description: 'Valida combinacoes de inputs obrigatorios condicionais antes de executar qualquer scan.'

inputs:
  enable_sca:
    description: 'SCA ativo (true/false).'
    required: true
  veracode_sca_token:
    description: 'Token do Veracode SCA.'
    required: false
  enable_iac:
    description: 'IaC/Secrets ativo (true/false).'
    required: true
  enable_iac_configs:
    description: 'Baixa regras IaC do repositório de baseline (true/false).'
    required: false
    default: 'false'
  enable_iac_baseline:
    description: 'Baseline IaC no repositório de baseline (true/false).'
    required: false
    default: 'false'
  enable_sca_baseline:
    description: 'Baseline SCA no repositório de baseline (true/false).'
    required: false
    default: 'false'
  sca_fail_on_severity:
    description: 'Severidades das vulnerabilidades SCA novas que afetam a política.'
    required: false
    default: ''
  iac_policy:
    description: 'Nome da política IaC (none = sem política).'
    required: false
    default: 'none'
  enable_error_logs:
    description: 'Diagnóstico de falhas técnicas ativo (true/false).'
    required: false
    default: 'true'
  enable_pipelinescan:
    description: 'Pipeline Scan ativo (true/false).'
    required: true
  baseline_mode:
    description: 'Provedor de baseline: none | portal_afrika | repo.'
    required: false
    default: 'none'
  portal_afrika_api_key:
    description: 'API Key do Portal Afrika.'
    required: false
  portal_afrika_base_url:
    description: 'URL base do Portal Afrika.'
    required: false
    default: ''
  enable_auto_packager:
    description: 'Auto Packager ativo (true/false).'
    required: true
  scan_file:
    description: 'Caminho do artefato compactado.'
    required: false
  enable_upload_scan:
    description: 'Upload & Scan ativo (true/false).'
    required: true
  veracode_api_id:
    description: 'ID da API do Veracode.'
    required: true
  veracode_api_key:
    description: 'Key da API do Veracode.'
    required: true
  create_issues:
    description: 'Cria/importa issues no GitHub (true/false).'
    required: false
    default: 'false'
  comment_pr:
    description: 'Publica comentário sticky no PR com resumo dos scans (true/false).'
    required: false
    default: 'false'
  baseline_org:
    description: 'Org dona do repositório de baseline (modo repo). Deve conter o repo informado em baseline_repo_name.'
    required: false
    default: ''
  baseline_repo_name:
    description: 'Nome do repositório de store de baseline (modo repo).'
    required: false
    default: 'Afrika-Veracode-Connect-Baseline'
  baseline_repo_branch:
    description: 'Branch do store de baseline (modo repo). Vazio usa a default_branch do store.'
    required: false
    default: ''
  baseline_github_app_id:
    description: 'GitHub App ID para acessar o repo de baseline.'
    required: false
    default: ''
  baseline_github_app_private_key:
    description: 'Private key PEM do GitHub App.'
    required: false
    default: ''
  baseline_github_app_installation_id:
    description: 'Installation ID do GitHub App na org do baseline.'
    required: false
    default: ''
  baseline_github_token:
    description: 'PAT fallback para o repo de baseline.'
    required: false
    default: ''
  veracode_sandbox:
    description: 'Upload & Scan sandbox: true, false ou vazio (auto).'
    required: false
    default: ''
  veracode_sandbox_name:
    description: 'Nome da sandbox (obrigatório quando veracode_sandbox=true, exceto com bypass=true).'
    required: false
    default: ''
  bypass:
    description: 'Quando true, dispensa veracode_sandbox_name porque o orquestrador envia a sandbox bypass (true/false).'
    required: false
    default: 'false'
  upload_scan_artifacts:
    description: 'all | primary.'
    required: false
    default: 'all'
  pipeline_scan_max_artifacts:
    description: 'Teto de slots (1-6).'
    required: false
    default: '6'
  pipeline_scan_retry:
    description: 'true/false.'
    required: false
    default: 'true'
  fail_on_cve:
    description: 'Lista de CVEs exatos para bloqueio pós-SCA (separados por vírgula, espaço ou quebra de linha).'
    required: false
    default: ''
  fail_on_severity:
    description: 'Severidades do Pipeline Scan com baseline (validadas e normalizadas entre aspas).'
    required: false
    default: ''
  enable_tools_cache:
    description: 'Cache de ferramentas Veracode (true/false).'
    required: false
    default: 'true'
  tools_cache_refresh:
    description: 'daily | weekly | monthly.'
    required: false
    default: 'weekly'
  tools_mirror_url:
    description: 'Mirror https das ferramentas Veracode (opcional).'
    required: false
    default: ''
  cache_dependencies:
    description: 'Cache de ~/.m2 e ~/.gradle (true/false).'
    required: false
    default: 'true'
  maven_mirror_url:
    description: 'Mirror Maven https (opcional).'
    required: false
    default: ''
  maven_mirror_of:
    description: 'mirrorOf do mirror Maven.'
    required: false
    default: 'central'
  maven_mirror_username:
    description: 'Usuário do mirror Maven.'
    required: false
    default: ''
  maven_mirror_password:
    description: 'Senha/token do mirror Maven.'
    required: false
    default: ''

outputs:
  baseline_mode:
    description: 'Modo de baseline resolvido (none | portal_afrika | repo).'
    value: ${{ steps.validate.outputs.baseline_mode }}
  baseline_org:
    description: 'Org do baseline (modo repo).'
    value: ${{ steps.validate.outputs.baseline_org }}
  baseline_repo_name:
    description: 'Nome do repositório de store de baseline (modo repo).'
    value: ${{ steps.validate.outputs.baseline_repo_name }}
  fail_on_severity:
    description: 'fail_on_severity normalizado e entre aspas para o Pipeline Scan oficial.'
    value: ${{ steps.validate.outputs.fail_on_severity }}

runs:
  using: 'composite'
  steps:
    - name: Validar inputs condicionais
      id: validate
      shell: bash
      env:
        ENABLE_SCA: ${{ inputs.enable_sca }}
        SCA_TOKEN: ${{ inputs.veracode_sca_token }}
        ENABLE_IAC: ${{ inputs.enable_iac }}
        ENABLE_IAC_CONFIGS: ${{ inputs.enable_iac_configs }}
        ENABLE_IAC_BASELINE: ${{ inputs.enable_iac_baseline }}
        ENABLE_SCA_BASELINE: ${{ inputs.enable_sca_baseline }}
        SCA_FAIL_ON_SEVERITY: ${{ inputs.sca_fail_on_severity }}
        IAC_POLICY: ${{ inputs.iac_policy }}
        ENABLE_ERROR_LOGS: ${{ inputs.enable_error_logs }}
        ENABLE_PIPELINE: ${{ inputs.enable_pipelinescan }}
        BASELINE_MODE: ${{ inputs.baseline_mode }}
        PORTAL_AFRIKA_KEY: ${{ inputs.portal_afrika_api_key }}
        PORTAL_AFRIKA_URL: ${{ inputs.portal_afrika_base_url }}
        ENABLE_AUTO_PACKAGER: ${{ inputs.enable_auto_packager }}
        SCAN_FILE: ${{ inputs.scan_file }}
        ENABLE_UPLOAD: ${{ inputs.enable_upload_scan }}
        VID: ${{ inputs.veracode_api_id }}
        VKEY: ${{ inputs.veracode_api_key }}
        CREATE_ISSUES: ${{ inputs.create_issues }}
        COMMENT_PR: ${{ inputs.comment_pr }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        BASELINE_ORG: ${{ inputs.baseline_org }}
        BASELINE_REPO_NAME: ${{ inputs.baseline_repo_name }}
        BASELINE_REPO_BRANCH: ${{ inputs.baseline_repo_branch }}
        BASELINE_GITHUB_APP_ID: ${{ inputs.baseline_github_app_id }}
        BASELINE_GITHUB_APP_PRIVATE_KEY: ${{ inputs.baseline_github_app_private_key }}
        BASELINE_GITHUB_APP_INSTALLATION_ID: ${{ inputs.baseline_github_app_installation_id }}
        BASELINE_GITHUB_TOKEN: ${{ inputs.baseline_github_token }}
        VERACODE_SANDBOX: ${{ inputs.veracode_sandbox }}
        VERACODE_SANDBOX_NAME: ${{ inputs.veracode_sandbox_name }}
        BYPASS: ${{ inputs.bypass }}
        UPLOAD_SCAN_ARTIFACTS: ${{ inputs.upload_scan_artifacts }}
        PIPELINE_SCAN_MAX_ARTIFACTS: ${{ inputs.pipeline_scan_max_artifacts }}
        PIPELINE_SCAN_RETRY: ${{ inputs.pipeline_scan_retry }}
        FAIL_ON_CVE: ${{ inputs.fail_on_cve }}
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        ENABLE_TOOLS_CACHE: ${{ inputs.enable_tools_cache }}
        TOOLS_CACHE_REFRESH: ${{ inputs.tools_cache_refresh }}
        TOOLS_MIRROR_URL: ${{ inputs.tools_mirror_url }}
        CACHE_DEPENDENCIES: ${{ inputs.cache_dependencies }}
        MAVEN_MIRROR_URL: ${{ inputs.maven_mirror_url }}
        MAVEN_MIRROR_OF: ${{ inputs.maven_mirror_of }}
        MAVEN_MIRROR_USERNAME: ${{ inputs.maven_mirror_username }}
        MAVEN_MIRROR_PASSWORD: ${{ inputs.maven_mirror_password }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/index.js"

    - name: Registrar falha de validação
      if: always() && env.VERACODE_CONNECT_ERROR_LOGS == 'true'
      continue-on-error: true
      shell: bash
      env:
        VC_COMPONENT: validate_inputs
        VC_STEPS: 'validate=${{ steps.validate.outcome }}'
      run: node "$GITHUB_ACTION_PATH/../error-logs/diagnostics.js" capture
