name: 'Veracode IaC / Secrets'
description: 'Roda o Veracode Container/IaC/Secrets scanning (directory scan), coleta resultados e publica como artefato.'

outputs:
  iac_status:
    description: 'Resultado do scan IaC/Secrets (success | failure | skipped).'
    value: ${{ steps.status.outputs.iac_status }}
  iac_policy_status:
    description: 'Resultado da política IaC (not_used | passed | failed | error).'
    value: ${{ steps.status.outputs.iac_policy_status }}

inputs:
  veracode_api_id:
    description: 'ID da API do Veracode (VID).'
    required: true
  veracode_api_key:
    description: 'Key da API do Veracode (VKEY).'
    required: true
  enable_iac_configs:
    description: 'Carrega regras customizadas do veracode.yml na raiz do repositório analisado.'
    required: false
    default: 'false'
  iac_policy:
    description: 'Nome da política Container/IaC Veracode; none mantém o fluxo atual.'
    required: false
    default: 'none'
  artifact_suffix:
    description: 'Sufixo único para o nome do artefato (evita conflito 409 em jobs paralelos).'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Preparar configurações IaC customizadas
      id: prepare_iac_config
      shell: bash
      env:
        ENABLE_IAC_CONFIGS: ${{ inputs.enable_iac_configs }}
      run: |
        set -euo pipefail

        IAC_HOME="$(mktemp -d "${RUNNER_TEMP%/}/veracode-connect-iac-home.XXXXXX")"
        cleanup_failed_prepare() {
          prepare_status=$?
          if [ "${prepare_status}" -ne 0 ]; then
            rm -rf -- "${IAC_HOME}"
          fi
        }
        trap cleanup_failed_prepare EXIT
        echo "home=${IAC_HOME}" >> "${GITHUB_OUTPUT}"

        mkdir -p "${IAC_HOME}/.veracode"
        chmod 700 "${IAC_HOME}" "${IAC_HOME}/.veracode"

        if [ "${ENABLE_IAC_CONFIGS}" = "true" ]; then
          CONFIG_SOURCE="${GITHUB_WORKSPACE}/veracode.yml"
          if [ -f "${CONFIG_SOURCE}" ] && [ ! -L "${CONFIG_SOURCE}" ]; then
            cp -- "${CONFIG_SOURCE}" "${IAC_HOME}/.veracode/veracode.yml"
            chmod 600 "${IAC_HOME}/.veracode/veracode.yml"
            echo "Regras customizadas IaC carregadas do veracode.yml da raiz do repositório."
          else
            echo "::warning::enable_iac_configs está habilitado, mas não há um arquivo regular veracode.yml na raiz do repositório analisado. O scan IaC continuará sem regras customizadas."
          fi
        fi

        trap - EXIT

    - name: Veracode Container/IaC/Secrets scan (diretório)
      id: iac_scan
      if: inputs.iac_policy == 'none'
      uses: veracode/container_iac_secrets_scanning@62c3ac94273f079be8d6bbd82065fca5b487d282 # v1.0.8
      env:
        HOME: ${{ steps.prepare_iac_config.outputs.home }}
      with:
        vid: ${{ inputs.veracode_api_id }}
        vkey: ${{ inputs.veracode_api_key }}
        github-token: ${{ github.token }}
        command: scan
        type: directory
        source: .
        format: json
        fail_build: 'false'
        fail_build_on_error: 'false'

    - name: Avaliar scan com política IaC
      id: iac_policy_scan
      if: always() && inputs.iac_policy != 'none'
      continue-on-error: true
      shell: bash
      env:
        IAC_POLICY: ${{ inputs.iac_policy }}
        HOME: ${{ steps.prepare_iac_config.outputs.home }}
        VERACODE_API_KEY_ID: ${{ inputs.veracode_api_id }}
        VERACODE_API_KEY_SECRET: ${{ inputs.veracode_api_key }}
      run: |
        set -uo pipefail
        policy_status="error"
        scan_status="failure"
        policy_ready="false"
        policy_dir="$(mktemp -d "${RUNNER_TEMP%/}/veracode-connect-iac-policy.XXXXXX")"
        cleanup_policy() {
          case "${policy_dir}" in
            "${RUNNER_TEMP%/}"/veracode-connect-iac-policy.*) rm -rf -- "${policy_dir}" ;;
          esac
        }
        trap cleanup_policy EXIT

        finish() {
          echo "iac_policy_status=${policy_status}" >> "${GITHUB_OUTPUT}"
          echo "scan_status=${scan_status}" >> "${GITHUB_OUTPUT}"
          if [ "${policy_status}" = "error" ]; then
            echo "::warning::A política IaC solicitada não foi aplicada/avaliada. Consulte os logs; os resultados do scan continuam disponíveis."
          fi
        }

        if [[ "${IAC_POLICY}" == *"/"* || "${IAC_POLICY}" == *"\\"* || "${IAC_POLICY}" == *"+"* || -z "${IAC_POLICY//[[:space:]]/}" ]]; then
          echo "::warning::Nome de política IaC inválido para o Veracode CLI."
          finish
          exit 0
        fi

        if [ "${RUNNER_OS:-Linux}" = "Windows" ]; then
          echo "::warning::A aplicação de políticas IaC customizadas requer um runner Linux."
          finish
          exit 0
        fi

        cli_dir="${GITHUB_WORKSPACE}/../veracode-cli"
        mkdir -p "${cli_dir}"
        if ! (cd "${cli_dir}" && curl -fsS https://tools.veracode.com/veracode-cli/install | sh); then
          echo "::warning::Falha ao instalar o Veracode CLI; o scan com política IaC não foi executado."
          finish
          exit 0
        fi
        cli_path="${cli_dir}/veracode"
        if [ ! -x "${cli_path}" ]; then
          echo "::warning::Veracode CLI não encontrado após a instalação; scan IaC não executado."
          finish
          exit 0
        fi

        policy_file=""
        if (cd "${policy_dir}" && "${cli_path}" policy get "${IAC_POLICY}"); then
          expected_policy_file="${policy_dir}/${IAC_POLICY}.rego"
          if [ -f "${expected_policy_file}" ]; then
            policy_file="${expected_policy_file}"
            policy_ready="true"
          else
            echo "::warning::O CLI não gerou o arquivo Rego esperado; será feita uma análise sem política."
          fi
        else
          echo "::warning::Não foi possível baixar a política IaC; será feita uma análise sem política."
        fi

        set +e
        (
          cd "${GITHUB_WORKSPACE}"
          if [ "${policy_ready}" = "true" ]; then
            "${cli_path}" scan --source . --type directory --policy "${policy_file}" --format json --output results.json --temp "${RUNNER_TEMP}"
          else
            "${cli_path}" scan --source . --type directory --format json --output results.json --temp "${RUNNER_TEMP}"
          fi
        )
        scan_exit=$?
        set -e
        echo "Veracode CLI JSON scan terminou com código ${scan_exit}."

        set +e
        (
          cd "${GITHUB_WORKSPACE}"
          if [ "${policy_ready}" = "true" ]; then
            "${cli_path}" scan --source . --type directory --policy "${policy_file}" --format table --output results.txt --temp "${RUNNER_TEMP}"
          else
            "${cli_path}" scan --source . --type directory --format table --output results.txt --temp "${RUNNER_TEMP}"
          fi
        )
        table_exit=$?
        set -e
        if [ "${table_exit}" -ne 0 ] && [ "${table_exit}" -ne 3 ]; then
          echo "::warning::Falha ao gerar results.txt; o resultado JSON continua disponível."
        fi

        if [ "${policy_ready}" = "true" ] && [ -f "${GITHUB_WORKSPACE}/results.json" ]; then
          policy_status="$(node "$GITHUB_ACTION_PATH/policy-evaluation.js" "${GITHUB_WORKSPACE}/results.json" "${scan_exit}")"
          if [ "${policy_status}" = "passed" ] || [ "${policy_status}" = "failed" ]; then
            scan_status="success"
          fi
        elif [ "${policy_ready}" = "false" ] && [ "${scan_exit}" -eq 0 ] && [ -f "${GITHUB_WORKSPACE}/results.json" ]; then
          scan_status="success"
        fi

        sbom_specs=(
          "cyclonedx-xml:sbom_cyclonedx_xml.xml"
          "cyclonedx-json:sbom_cyclonedx_json.json"
          "spdx-tag-value:sbom_spdx_tag_value.json"
          "spdx-json:sbom_spdx_json.json"
          "github:sbom_github.json"
        )
        for spec in "${sbom_specs[@]}"; do
          format="${spec%%:*}"
          output="${spec#*:}"
          set +e
          (cd "${GITHUB_WORKSPACE}" && "${cli_path}" sbom --source . --type directory --format "${format}" --output "${output}")
          sbom_exit=$?
          set -e
          if [ "${sbom_exit}" -ne 0 ]; then
            echo "::warning::Falha ao gerar o SBOM ${format}; o resultado da política IaC será preservado."
          fi
        done
        finish
        exit 0

    - name: Limpar configurações temporárias IaC
      if: always() && steps.prepare_iac_config.outputs.home != ''
      shell: bash
      env:
        IAC_HOME: ${{ steps.prepare_iac_config.outputs.home }}
      run: |
        set -euo pipefail
        case "${IAC_HOME}" in
          "${RUNNER_TEMP%/}"/veracode-connect-iac-home.*)
            rm -rf -- "${IAC_HOME}"
            ;;
          *)
            echo "::warning::Diretório temporário IaC fora do caminho esperado; limpeza ignorada."
            ;;
        esac

    - name: Definir status
      if: always()
      id: status
      shell: bash
      env:
        IAC_POLICY: ${{ inputs.iac_policy }}
        IAC_SCAN_OUTCOME: ${{ steps.iac_scan.outcome }}
        IAC_SCAN_STATUS: ${{ steps.iac_policy_scan.outputs.scan_status || 'failure' }}
        IAC_POLICY_STATUS: ${{ steps.iac_policy_scan.outputs.iac_policy_status || 'error' }}
      run: |
        set -euo pipefail
        echo "::group::Definir status IaC/Secrets"
        iac_status="$(node "$GITHUB_ACTION_PATH/policy-evaluation.js" status)"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success IAC_STATUS_SET "status=${iac_status}")"
        echo "::endgroup::"

    - name: Coletar arquivos de resultado do IaC
      id: collect_results
      if: always()
      shell: bash
      run: |
        set -euo pipefail

        echo "::group::Coletar resultados IaC/Secrets"
        mkdir -p iac-results

        # Lista de nomes de arquivos esperados
        files=(
          "results.json"
          "results.txt"
          "sbom_cyclonedx_xml.xml"
          "sbom_cyclonedx_json.json"
          "sbom_spdx_tag_value.json"
          "sbom_spdx_json.json"
          "sbom_github.json"
        )

        moved_any="false"

        # 1) Tentar mover do diretório atual
        for f in "${files[@]}"; do
          if [ -f "${f}" ]; then
            mv -f "${f}" "iac-results/${f}"
            moved_any="true"
          fi
        done

        # 2) Se não encontrou, buscar em subdiretórios comuns
        if [ "${moved_any}" != "true" ]; then
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success RESULTS_SEARCH_SUBDIRS)"
          for f in "${files[@]}"; do
            found=$(find "${GITHUB_WORKSPACE}" -maxdepth 3 -name "${f}" -not -path "*/iac-results/*" -not -path "*/node_modules/*" -print -quit 2>/dev/null || true)
            if [ -n "${found}" ]; then
              echo "$(node "$GITHUB_ACTION_PATH/messages.js" success FILE_FOUND "path=${found}")"
              cp -f "${found}" "iac-results/${f}"
              moved_any="true"
            fi
          done
        fi

        if [ "${moved_any}" != "true" ]; then
          echo "::warning::$(node "$GITHUB_ACTION_PATH/messages.js" warning NO_IAC_RESULTS)"
          find "${GITHUB_WORKSPACE}" -maxdepth 3 -name '*.json' -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null | head -20 || true
        else
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success RESULTS_COLLECTED)"
          ls -la iac-results || true
        fi
        echo "::endgroup::"

    - name: Calcular nome do artefato IaC
      id: artifact_name
      if: always()
      shell: bash
      env:
        SUFFIX: ${{ inputs.artifact_suffix }}
      run: |
        set -euo pipefail
        echo "::group::Calcular nome do artefato IaC"
        if [ -n "${SUFFIX}" ]; then
          ARTIFACT_NAME="iac-results-${SUFFIX}"
        else
          ARTIFACT_NAME="iac-results"
        fi
        echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success ARTIFACT_NAME_SET "name=${ARTIFACT_NAME}")"
        echo "::endgroup::"

    - name: Upload artefato IaC
      id: upload_iac_artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.artifact_name.outputs.name }}
        path: |
          iac-results
        if-no-files-found: warn
        retention-days: 3

    - name: Gerar Summary do IaC
      id: iac_summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Gerar Summary do IaC/Secrets"

        FRAG_DIR="${RUNNER_TEMP}/veracode-connect-summary"
        mkdir -p "${FRAG_DIR}"
        export IAC_POLICY_STATUS="${{ steps.status.outputs.iac_policy_status || 'not_used' }}"
        export IAC_POLICY_NAME="${{ inputs.iac_policy }}"
        node "$GITHUB_ACTION_PATH/summary-findings.js" summary-md \
          "${GITHUB_WORKSPACE}/iac-results/results.json" \
          > "${FRAG_DIR}/iac.md"
        echo "::endgroup::"

    - name: Registrar falhas do IaC
      if: always() && env.VERACODE_CONNECT_ERROR_LOGS == 'true'
      continue-on-error: true
      shell: bash
      env:
        VC_COMPONENT: iac
        VC_STEPS: |
          iac_scan=${{ steps.iac_scan.outcome }}
          status=${{ steps.status.outcome }}
          collect_results=${{ steps.collect_results.outcome }}
          artifact_name=${{ steps.artifact_name.outcome }}
          upload_iac_artifact=${{ steps.upload_iac_artifact.outcome }}
          iac_summary=${{ steps.iac_summary.outcome }}
        VC_IAC_RESULT: ${{ github.workspace }}/iac-results/results.json
      run: node "$GITHUB_ACTION_PATH/../error-logs/diagnostics.js" capture
