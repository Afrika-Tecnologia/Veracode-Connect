name: 'Veracode SCA'
description: 'Roda o Veracode Software Composition Analysis (SCA) via action oficial e publica os resultados como artefato.'

inputs:
  veracode_sca_token:
    description: 'Token de API do Veracode SCA (mapeado para SRCCLR_API_TOKEN).'
    required: true
  artifact_suffix:
    description: 'Sufixo único para o nome do artefato (evita conflito 409 em jobs paralelos).'
    required: false
    default: ''
  create_issues:
    description: 'Cria issues no GitHub para vulnerabilidades SCA encontradas (true/false).'
    required: false
    default: 'false'
  platform_type:
    description: 'CLOUD (github.com) ou ENTERPRISE (GHES).'
    required: false
    default: 'CLOUD'
  policy_fail:
    description: 'Repassa breakBuildOnPolicyFindings para a action oficial; o orquestrador bloqueia somente ao final (true/false).'
    required: false
    default: 'false'
  fail_on_cve:
    description: 'Lista de CVEs exatos que, se encontrados no resultado SCA, marcam o SCA como failure (com policy_fail=true). Vale com ou sem baseline.'
    required: false
    default: ''
  enable_sca_baseline:
    description: 'Baseline SCA no repositório de baseline (sca-baseline.json, write-once): só vulnerabilidades novas que afetam a política bloqueiam.'
    required: false
    default: 'false'
  sca_fail_on_severity:
    description: 'Com baseline SCA, severidades das vulnerabilidades novas que afetam a política (ex.: "Very High, High"). Vazio = todas.'
    required: false
    default: ''
  baseline_org:
    description: 'Organização dona do repositório de baseline.'
    required: false
    default: ''
  baseline_repo_name:
    description: 'Repositório de baseline.'
    required: false
    default: 'Afrika-Veracode-Connect-Baseline'
  baseline_repo_branch:
    description: 'Branch do repositório de baseline. Vazio usa a default_branch dele.'
    required: false
    default: ''
  baseline_github_app_id:
    description: 'GitHub App ID do repositório de baseline.'
    required: false
    default: ''
  baseline_github_app_private_key:
    description: 'Private key PEM do GitHub App.'
    required: false
    default: ''
  baseline_github_app_installation_id:
    description: 'Installation ID do GitHub App.'
    required: false
    default: ''
  baseline_github_token:
    description: 'PAT fallback com Contents: read/write no repositório de baseline.'
    required: false
    default: ''

outputs:
  sca_status:
    description: 'Resultado do SCA (success | failure | warning).'
    value: ${{ steps.run_sca.outputs.sca_status }}
  cve_blocked_count:
    description: 'Quantidade de findings SCA cujo CVE está em fail_on_cve.'
    value: ${{ steps.cve_gate.outputs.cve_blocked_count || '0' }}
  cve_blocked_list:
    description: 'CVEs de fail_on_cve encontrados no resultado SCA (separados por vírgula).'
    value: ${{ steps.cve_gate.outputs.cve_blocked_list || '' }}
  scan_url:
    description: 'URL do relatório SCA no portal Veracode.'
    value: ${{ steps.veracode_sca_run.outputs.scan-url }}
  sca_baseline_status:
    description: 'Estado do baseline SCA (not_used | deferred | seeded | compared | error).'
    value: ${{ steps.baseline_state.outputs.status || 'not_used' }}
  has_sca_baseline:
    description: 'true quando o baseline SCA já existia no repositório de baseline.'
    value: ${{ steps.get_sca_baseline.outputs.has_baseline || 'false' }}
  sca_new_policy_count:
    description: 'Vulnerabilidades SCA novas (fora do baseline) que afetam a política.'
    value: ${{ steps.sca_baseline.outputs.new_policy_count || '0' }}
  sca_new_count:
    description: 'Vulnerabilidades SCA novas (fora do baseline), afetando ou não a política.'
    value: ${{ steps.sca_baseline.outputs.new_count || '0' }}
  sca_backlog_count:
    description: 'Vulnerabilidades SCA já presentes no baseline que continuam no scan atual.'
    value: ${{ steps.sca_baseline.outputs.backlog_count || '0' }}

runs:
  using: 'composite'
  steps:
    - name: Preparar resultados da execução SCA
      id: prepare_results
      shell: bash
      run: |
        set -euo pipefail
        rm -f -- scaResults.txt scaResults.json veracode_sca.log sca-results/sca-baseline-diff.json

    - name: Consultar baseline SCA no repositório
      id: get_sca_baseline
      if: inputs.enable_sca_baseline == 'true'
      continue-on-error: true
      shell: bash
      env:
        BASELINE_ORG: ${{ inputs.baseline_org }}
        BASELINE_REPO_NAME: ${{ inputs.baseline_repo_name }}
        BASELINE_REPO_BRANCH: ${{ inputs.baseline_repo_branch }}
        BASELINE_GITHUB_APP_ID: ${{ inputs.baseline_github_app_id }}
        BASELINE_GITHUB_APP_PRIVATE_KEY: ${{ inputs.baseline_github_app_private_key }}
        BASELINE_GITHUB_APP_INSTALLATION_ID: ${{ inputs.baseline_github_app_installation_id }}
        BASELINE_GITHUB_TOKEN: ${{ inputs.baseline_github_token }}
        SCAN_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        BASELINE_FILE: ${{ runner.temp }}/veracode-connect-sca-baseline/sca-baseline.json
      run: |
        set -euo pipefail
        echo "::group::Baseline SCA (consulta)"
        rm -f -- "${BASELINE_FILE}"
        node "$GITHUB_ACTION_PATH/../baseline-store/cli.js" get --kind sca --out "${BASELINE_FILE}"
        echo "::endgroup::"

    - name: Rodar Veracode SCA
      id: veracode_sca_run
      continue-on-error: true
      uses: veracode/veracode-sca@aeeb6aaa608a49195cab32c44b75db4f6a07a2df # v2.1.20
      env:
        SRCCLR_API_TOKEN: ${{ inputs.veracode_sca_token }}
      with:
        github_token: ${{ github.token }}
        create-issues: ${{ inputs.create_issues }}
        allow-dirty: 'true'
        recursive: 'true'
        update_advisor: 'true'
        platformType: ${{ inputs.platform_type }}
        # Com baseline SCA o break-build do agente (que avalia todas as vulnerabilidades) não é repassado.
        breakBuildOnPolicyFindings: ${{ inputs.enable_sca_baseline == 'true' && 'false' || inputs.policy_fail }}
        # Gera scaResults.json (e scaResults.txt) sem depender de create-issues; sem pr_number a etapa de fix é pulada.
        sca_fix_enabled: 'true'

    - name: Avaliar fail_on_cve
      id: cve_gate
      if: always()
      shell: bash
      env:
        FAIL_ON_CVE: ${{ inputs.fail_on_cve }}
        SCA_JSON: ${{ github.workspace }}/scaResults.json
        SCA_TXT: ${{ github.workspace }}/scaResults.txt
      run: |
        set -euo pipefail
        echo "::group::Avaliar fail_on_cve"
        node "$GITHUB_ACTION_PATH/cve-gate.js"
        echo "::endgroup::"

    - name: Comparar com o baseline SCA
      id: sca_baseline
      if: always() && inputs.enable_sca_baseline == 'true'
      continue-on-error: true
      shell: bash
      env:
        GET_OUTCOME: ${{ steps.get_sca_baseline.outcome }}
        HAS_BASELINE: ${{ steps.get_sca_baseline.outputs.has_baseline }}
        RESULTS_FILE: ${{ github.workspace }}/scaResults.json
        BASELINE_FILE: ${{ runner.temp }}/veracode-connect-sca-baseline/sca-baseline.json
        DIFF_FILE: ${{ github.workspace }}/sca-results/sca-baseline-diff.json
        SCA_FAIL_ON_SEVERITY: ${{ inputs.sca_fail_on_severity }}
        FAIL_ON_CVE: ${{ inputs.fail_on_cve }}
        SCAN_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        echo "::group::Baseline SCA (comparação)"
        node "$GITHUB_ACTION_PATH/../sca-baseline/sca-baseline.js" evaluate
        echo "::endgroup::"

    - name: Resolver elegibilidade do seed do baseline SCA
      id: sca_seed_gate
      if: always() && steps.sca_baseline.outputs.sca_baseline_status == 'deferred'
      shell: bash
      env:
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        HAS_BASELINE: 'false'
      run: node "$GITHUB_ACTION_PATH/../baseline-store/seed-gate.js"

    # Write-once: o store recusa sobrescrever um sca-baseline.json existente.
    - name: Gravar baseline SCA no repositório
      id: sca_seed
      if: always() && steps.sca_seed_gate.outputs.can_seed == 'true'
      continue-on-error: true
      shell: bash
      env:
        BASELINE_ORG: ${{ inputs.baseline_org }}
        BASELINE_REPO_NAME: ${{ inputs.baseline_repo_name }}
        BASELINE_REPO_BRANCH: ${{ inputs.baseline_repo_branch }}
        BASELINE_GITHUB_APP_ID: ${{ inputs.baseline_github_app_id }}
        BASELINE_GITHUB_APP_PRIVATE_KEY: ${{ inputs.baseline_github_app_private_key }}
        BASELINE_GITHUB_APP_INSTALLATION_ID: ${{ inputs.baseline_github_app_installation_id }}
        BASELINE_GITHUB_TOKEN: ${{ inputs.baseline_github_token }}
        SCAN_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        RESULTS_FILE: ${{ github.workspace }}/scaResults.json
        SEED_FILE: ${{ runner.temp }}/veracode-connect-sca-baseline/sca-baseline-seed.json
      run: |
        set -euo pipefail
        echo "::group::Baseline SCA (gravar)"
        node "$GITHUB_ACTION_PATH/../sca-baseline/sca-baseline.js" build --results "${RESULTS_FILE}" --out "${SEED_FILE}"
        node "$GITHUB_ACTION_PATH/../baseline-store/cli.js" put --kind sca --file "${SEED_FILE}"
        echo "::endgroup::"

    - name: Consolidar estado do baseline SCA
      id: baseline_state
      if: always() && inputs.enable_sca_baseline == 'true'
      shell: bash
      env:
        EVALUATED: ${{ steps.sca_baseline.outputs.sca_baseline_status || 'error' }}
        SEEDED: ${{ steps.sca_seed.outputs.baseline_seeded }}
      run: |
        set -euo pipefail
        status="${EVALUATED}"
        if [ "${status}" = "deferred" ] && [ "${SEEDED}" = "true" ]; then
          status="seeded"
        fi
        echo "status=${status}" >> "$GITHUB_OUTPUT"
        echo "sca_baseline_status=${status}"

    - name: Definir status do SCA
      id: run_sca
      if: always()
      shell: bash
      env:
        SCA_OUTCOME: ${{ steps.veracode_sca_run.outcome }}
        POLICY_FAIL: ${{ inputs.policy_fail }}
        CVE_BLOCKED_COUNT: ${{ steps.cve_gate.outputs.cve_blocked_count || '0' }}
        SCA_BASELINE_STATUS: ${{ steps.baseline_state.outputs.status || '' }}
        SCA_NEW_POLICY_COUNT: ${{ steps.sca_baseline.outputs.new_policy_count || '0' }}
      run: |
        set -euo pipefail
        echo "::group::Definir status do SCA"
        status="$(node "$GITHUB_ACTION_PATH/status.js")"
        if [ "${SCA_OUTCOME}" = "failure" ]; then
          echo "::warning::$(node "$GITHUB_ACTION_PATH/messages.js" warning SCA_FAILED_CONTINUE)"
        fi
        echo "sca_status=${status}" >> "$GITHUB_OUTPUT"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCA_STATUS_SET "status=${status}")"
        echo "::endgroup::"

    - name: Normalizar artefatos SCA
      id: normalize_results
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Normalizar artefatos SCA"
        if [ -f "scaResults.txt" ]; then
          cp -f scaResults.txt veracode_sca.log
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCA_ARTIFACT_NORMALIZED "file=veracode_sca.log" "source=scaResults.txt")"
        elif [ -f "scaResults.json" ]; then
          cp -f scaResults.json veracode_sca.log
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCA_ARTIFACT_NORMALIZED "file=veracode_sca.log" "source=scaResults.json")"
        else
          echo "::warning::$(node "$GITHUB_ACTION_PATH/messages.js" warning NO_SCA_RESULTS)"
        fi
        echo "::endgroup::"

    - name: Calcular nome do artefato SCA
      id: artifact_name
      if: always()
      shell: bash
      env:
        SUFFIX: ${{ inputs.artifact_suffix }}
      run: |
        set -euo pipefail
        echo "::group::Calcular nome do artefato SCA"
        if [ -n "${SUFFIX}" ]; then
          ARTIFACT_NAME="sca-results-${SUFFIX}"
        else
          ARTIFACT_NAME="sca-results"
        fi
        echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success ARTIFACT_NAME_SET "name=${ARTIFACT_NAME}")"
        echo "::endgroup::"

    - name: Upload artefato SCA
      id: upload_sca_artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.artifact_name.outputs.name }}
        path: |
          veracode_sca.log
          scaResults.txt
          scaResults.json
          sca-results/sca-baseline-diff.json
        if-no-files-found: warn
        retention-days: 3

    - name: Gerar Summary do SCA
      id: sca_summary
      if: always()
      shell: bash
      env:
        CREATE_ISSUES: ${{ inputs.create_issues }}
        FAIL_ON_CVE: ${{ inputs.fail_on_cve }}
        CVE_BLOCKED_PATH: ${{ runner.temp }}/veracode-connect-summary/sca-cve-blocked.json
        SCA_BASELINE_STATUS: ${{ steps.baseline_state.outputs.status || 'not_used' }}
        SCA_BASELINE_DIFF: ${{ github.workspace }}/sca-results/sca-baseline-diff.json
        SCA_BASELINE_CAN_SEED: ${{ steps.sca_seed_gate.outputs.can_seed }}
      run: |
        set -euo pipefail
        echo "::group::Gerar Summary do SCA"

        FRAG_DIR="${RUNNER_TEMP}/veracode-connect-summary"
        mkdir -p "${FRAG_DIR}"
        node "$GITHUB_ACTION_PATH/summary-findings.js" summary-md \
          "${GITHUB_WORKSPACE}/scaResults.json" \
          "${GITHUB_WORKSPACE}/scaResults.txt" \
          > "${FRAG_DIR}/sca.md"
        echo "::endgroup::"

    - name: Registrar falhas do SCA
      if: always() && env.VERACODE_CONNECT_ERROR_LOGS == 'true'
      continue-on-error: true
      shell: bash
      env:
        VC_COMPONENT: sca
        VC_STEPS: |
          get_sca_baseline=${{ steps.get_sca_baseline.outcome }}
          veracode_sca_run=${{ steps.veracode_sca_run.outcome }}
          cve_gate=${{ steps.cve_gate.outcome }}
          sca_baseline=${{ steps.sca_baseline.outcome }}
          sca_seed_gate=${{ steps.sca_seed_gate.outcome }}
          sca_seed=${{ steps.sca_seed.outcome }}
          baseline_state=${{ steps.baseline_state.outcome }}
          run_sca=${{ steps.run_sca.outcome }}
          normalize_results=${{ steps.normalize_results.outcome }}
          artifact_name=${{ steps.artifact_name.outcome }}
          upload_sca_artifact=${{ steps.upload_sca_artifact.outcome }}
          sca_summary=${{ steps.sca_summary.outcome }}
        VC_SCA_RESULT: ${{ github.workspace }}/scaResults.json
        VC_SCA_TEXT: ${{ github.workspace }}/scaResults.txt
      run: node "$GITHUB_ACTION_PATH/../error-logs/diagnostics.js" capture
