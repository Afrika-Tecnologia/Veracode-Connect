name: 'Veracode SCA'
description: 'Roda o Veracode Software Composition Analysis (SCA) via action oficial e publica os resultados como artefato.'

inputs:
  veracode_sca_token:
    description: 'Token de API do Veracode SCA (mapeado para SRCCLR_API_TOKEN).'
    required: true
  artifact_suffix:
    description: 'Sufixo único para o nome do artefato (evita conflito 409 em jobs paralelos).'
    required: false
    default: ''
  create_issues:
    description: 'Cria issues no GitHub para vulnerabilidades SCA encontradas (true/false).'
    required: false
    default: 'false'
  platform_type:
    description: 'CLOUD (github.com) ou ENTERPRISE (GHES).'
    required: false
    default: 'CLOUD'

outputs:
  sca_status:
    description: 'Resultado do SCA (success | warning).'
    value: ${{ steps.run_sca.outputs.sca_status }}
  scan_url:
    description: 'URL do relatório SCA no portal Veracode.'
    value: ${{ steps.veracode_sca_run.outputs.scan-url }}

runs:
  using: 'composite'
  steps:
    - name: Rodar Veracode SCA
      id: veracode_sca_run
      uses: veracode/veracode-sca@01bdc0cbd6b4990e93519deedc5140e5ff48b98e # v2.1.19
      env:
        SRCCLR_API_TOKEN: ${{ inputs.veracode_sca_token }}
      with:
        github_token: ${{ github.token }}
        create-issues: ${{ inputs.create_issues }}
        allow-dirty: 'true'
        recursive: 'true'
        update_advisor: 'true'
        platformType: ${{ inputs.platform_type }}
        breakBuildOnPolicyFindings: 'false'

    - name: Definir status do SCA
      id: run_sca
      if: always()
      shell: bash
      env:
        SCA_OUTCOME: ${{ steps.veracode_sca_run.outcome }}
      run: |
        set -euo pipefail
        echo "::group::Definir status do SCA"
        if [ "${SCA_OUTCOME}" = "failure" ]; then
          echo "::warning::Veracode SCA retornou falha (o job continua; trava final via build-gate)."
          echo "sca_status=warning" >> "$GITHUB_OUTPUT"
          echo "Status do SCA definido: \"warning\" (scan falhou, job segue)"
        else
          echo "sca_status=success" >> "$GITHUB_OUTPUT"
          echo "Status do SCA definido: \"success\""
        fi
        echo "::endgroup::"

    - name: Normalizar artefatos SCA
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Normalizar artefatos SCA"
        if [ -f "scaResults.txt" ]; then
          cp -f scaResults.txt veracode_sca.log
          echo "Artefato SCA normalizado com sucesso: \"veracode_sca.log\" (origem: scaResults.txt)"
        elif [ -f "scaResults.json" ]; then
          cp -f scaResults.json veracode_sca.log
          echo "Artefato SCA normalizado com sucesso: \"veracode_sca.log\" (origem: scaResults.json)"
        else
          echo "::warning::Nenhum scaResults.txt/json encontrado após o scan SCA."
          echo "Normalização de artefatos SCA: nenhum arquivo de resultado encontrado."
        fi
        echo "::endgroup::"

    - name: Calcular nome do artefato SCA
      id: artifact_name
      if: always()
      shell: bash
      env:
        SUFFIX: ${{ inputs.artifact_suffix }}
      run: |
        set -euo pipefail
        echo "::group::Calcular nome do artefato SCA"
        if [ -n "${SUFFIX}" ]; then
          ARTIFACT_NAME="sca-results-${SUFFIX}"
        else
          ARTIFACT_NAME="sca-results"
        fi
        echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
        echo "Nome do artefato SCA definido: \"${ARTIFACT_NAME}\""
        echo "::endgroup::"

    - name: Upload artefato SCA
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.artifact_name.outputs.name }}
        path: |
          veracode_sca.log
          scaResults.txt
          scaResults.json
        if-no-files-found: warn
        retention-days: 3

    - name: Gerar Summary do SCA
      if: always()
      shell: bash
      env:
        SCA_STATUS: ${{ steps.run_sca.outputs.sca_status }}
        SCAN_URL: ${{ steps.veracode_sca_run.outputs.scan-url }}
        CREATE_ISSUES: ${{ inputs.create_issues }}
      run: |
        set -euo pipefail
        echo "::group::Gerar Summary do SCA"

        {
          echo "### 🔍 Veracode SCA (Software Composition Analysis)"
          echo ""

          if [ -n "${SCAN_URL:-}" ]; then
            echo "> 🔗 [Relatório completo no Veracode](${SCAN_URL})"
            echo ""
          fi

          if [ "${CREATE_ISSUES}" = "true" ]; then
            echo "> 📝 Issues GitHub: **habilitado** (\`create_issues: true\`)"
          else
            echo "> 📝 Issues GitHub: desabilitado"
          fi
          echo ""

          SCA_LOG=""
          if [ -f "scaResults.txt" ]; then
            SCA_LOG="scaResults.txt"
          elif [ -f "veracode_sca.log" ]; then
            SCA_LOG="veracode_sca.log"
          fi

          if [ -n "${SCA_LOG}" ]; then
            VULN_CRITICAL=$(grep -oiP 'Critical\s+Risk\s+Vulnerabilities\s+\K\d+' "${SCA_LOG}" 2>/dev/null | head -1 || echo "0")
            VULN_HIGH=$(grep -oiP 'High\s+Risk\s+Vulnerabilities\s+\K\d+' "${SCA_LOG}" 2>/dev/null | head -1 || echo "0")
            VULN_MEDIUM=$(grep -oiP 'Medium\s+Risk\s+Vulnerabilities\s+\K\d+' "${SCA_LOG}" 2>/dev/null | head -1 || echo "0")
            VULN_LOW=$(grep -oiP 'Low\s+Risk\s+Vulnerabilities\s+\K\d+' "${SCA_LOG}" 2>/dev/null | head -1 || echo "0")
            VULN_TOTAL=$(( ${VULN_CRITICAL:-0} + ${VULN_HIGH:-0} + ${VULN_MEDIUM:-0} + ${VULN_LOW:-0} ))
            LIB_TOTAL=$(grep -oiP 'Total\s+Libraries\s+\K\d+' "${SCA_LOG}" 2>/dev/null | head -1 || echo "0")
            DIRECT_LIBS=$(grep -oiP 'Direct\s+Libraries\s+\K\d+' "${SCA_LOG}" 2>/dev/null | head -1 || echo "0")
            VULN_LIBS=$(grep -oiP 'Vulnerable\s+Libraries\s+\K\d+' "${SCA_LOG}" 2>/dev/null | head -1 || echo "0")

            echo "| Severidade | Quantidade |"
            echo "|---|---|"
            echo "| 🔴 Critical Risk | ${VULN_CRITICAL} |"
            echo "| 🟠 High Risk | ${VULN_HIGH} |"
            echo "| 🟡 Medium Risk | ${VULN_MEDIUM} |"
            echo "| 🔵 Low Risk | ${VULN_LOW} |"
            echo "| **Total Vulnerabilidades** | **${VULN_TOTAL}** |"
            echo "| Bibliotecas vulneráveis | ${VULN_LIBS} |"
            echo "| Total de bibliotecas analisadas | ${LIB_TOTAL} |"
            echo "| Bibliotecas diretas | ${DIRECT_LIBS} |"
            TRANSITIVE_LIBS=$(( ${LIB_TOTAL:-0} - ${DIRECT_LIBS:-0} ))
            echo "| Bibliotecas transitivas | ${TRANSITIVE_LIBS} |"
            echo ""

            VULN_LINES=$(grep -cP '^\s*(CVE-\S+|NO-CVE)\s+' "${SCA_LOG}" 2>/dev/null || echo "0")
            if [ "${VULN_LINES}" -gt 0 ] 2>/dev/null; then
              echo "<details><summary>📋 Detalhes das vulnerabilidades (${VULN_LINES})</summary>"
              echo ""
              echo "| # | Severidade | CVE | Descrição | Biblioteca |"
              echo "|---|---|---|---|---|"

              grep -P '^\s*(CVE-\S+|NO-CVE)\s+' "${SCA_LOG}" 2>/dev/null | awk -F'  +' '{
                gsub(/^[ \t]+/, "", $0);
                cve=$1; sev=$2; desc=$3; lib=$4;
                gsub(/^[ \t]+|[ \t]+$/, "", cve);
                gsub(/^[ \t]+|[ \t]+$/, "", sev);
                gsub(/^[ \t]+|[ \t]+$/, "", desc);
                gsub(/^[ \t]+|[ \t]+$/, "", lib);
                icon="⚪"; order=5;
                if (sev ~ /Critical/) { icon="🔴"; order=1; }
                else if (sev ~ /High/) { icon="🟠"; order=2; }
                else if (sev ~ /Medium/) { icon="🟡"; order=3; }
                else if (sev ~ /Low/) { icon="🔵"; order=4; }
                printf "%d\t| - | %s %s | %s | %s | %s |\n", order, icon, sev, cve, desc, lib
              }' | sort -t$'\t' -k1,1n | cut -f2- | awk '{ gsub(/^\| - \|/, "| " NR " |"); print }' || true

              echo ""
              echo "</details>"
            fi
          elif [ -f "scaResults.json" ]; then
            TOTAL=$(jq '[.. | objects | select(has("vulnerability"))] | length' scaResults.json 2>/dev/null || echo "0")
            echo "> Resultado em JSON (\`scaResults.json\`). Total aproximado de entradas: **${TOTAL}**"
          else
            echo "> ⚠️ Nenhum artefato de resultado SCA encontrado."
          fi

          echo ""
          echo "| Status interno | \`${SCA_STATUS}\` |"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        echo "Summary do SCA gerado com sucesso."
        echo "::endgroup::"
