name: 'Veracode SCA'
description: 'Roda o Veracode Software Composition Analysis (SCA) via action oficial e publica os resultados como artefato.'

inputs:
  veracode_sca_token:
    description: 'Token de API do Veracode SCA (mapeado para SRCCLR_API_TOKEN).'
    required: true
  artifact_suffix:
    description: 'Sufixo único para o nome do artefato (evita conflito 409 em jobs paralelos).'
    required: false
    default: ''
  create_issues:
    description: 'Cria issues no GitHub para vulnerabilidades SCA encontradas (true/false).'
    required: false
    default: 'false'
  platform_type:
    description: 'CLOUD (github.com) ou ENTERPRISE (GHES).'
    required: false
    default: 'CLOUD'

outputs:
  sca_status:
    description: 'Resultado do SCA (success | warning).'
    value: ${{ steps.run_sca.outputs.sca_status }}
  scan_url:
    description: 'URL do relatório SCA no portal Veracode.'
    value: ${{ steps.veracode_sca_run.outputs.scan-url }}

runs:
  using: 'composite'
  steps:
    - name: Rodar Veracode SCA
      id: veracode_sca_run
      uses: veracode/veracode-sca@aeeb6aaa608a49195cab32c44b75db4f6a07a2df # v2.1.20
      env:
        SRCCLR_API_TOKEN: ${{ inputs.veracode_sca_token }}
      with:
        github_token: ${{ github.token }}
        create-issues: ${{ inputs.create_issues }}
        allow-dirty: 'true'
        recursive: 'true'
        update_advisor: 'true'
        platformType: ${{ inputs.platform_type }}
        breakBuildOnPolicyFindings: 'false'

    - name: Definir status do SCA
      id: run_sca
      if: always()
      shell: bash
      env:
        SCA_OUTCOME: ${{ steps.veracode_sca_run.outcome }}
      run: |
        set -euo pipefail
        echo "::group::Definir status do SCA"
        if [ "${SCA_OUTCOME}" = "failure" ]; then
          echo "::warning::$(node "$GITHUB_ACTION_PATH/messages.js" warning SCA_FAILED_CONTINUE)"
          echo "sca_status=warning" >> "$GITHUB_OUTPUT"
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCA_STATUS_SET "status=warning")"
        else
          echo "sca_status=success" >> "$GITHUB_OUTPUT"
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCA_STATUS_SET "status=success")"
        fi
        echo "::endgroup::"

    - name: Normalizar artefatos SCA
      id: normalize_results
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Normalizar artefatos SCA"
        if [ -f "scaResults.txt" ]; then
          cp -f scaResults.txt veracode_sca.log
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCA_ARTIFACT_NORMALIZED "file=veracode_sca.log" "source=scaResults.txt")"
        elif [ -f "scaResults.json" ]; then
          cp -f scaResults.json veracode_sca.log
          echo "$(node "$GITHUB_ACTION_PATH/messages.js" success SCA_ARTIFACT_NORMALIZED "file=veracode_sca.log" "source=scaResults.json")"
        else
          echo "::warning::$(node "$GITHUB_ACTION_PATH/messages.js" warning NO_SCA_RESULTS)"
        fi
        echo "::endgroup::"

    - name: Calcular nome do artefato SCA
      id: artifact_name
      if: always()
      shell: bash
      env:
        SUFFIX: ${{ inputs.artifact_suffix }}
      run: |
        set -euo pipefail
        echo "::group::Calcular nome do artefato SCA"
        if [ -n "${SUFFIX}" ]; then
          ARTIFACT_NAME="sca-results-${SUFFIX}"
        else
          ARTIFACT_NAME="sca-results"
        fi
        echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success ARTIFACT_NAME_SET "name=${ARTIFACT_NAME}")"
        echo "::endgroup::"

    - name: Upload artefato SCA
      id: upload_sca_artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.artifact_name.outputs.name }}
        path: |
          veracode_sca.log
          scaResults.txt
          scaResults.json
        if-no-files-found: warn
        retention-days: 3

    - name: Gerar Summary do SCA
      id: sca_summary
      if: always()
      shell: bash
      env:
        CREATE_ISSUES: ${{ inputs.create_issues }}
      run: |
        set -euo pipefail
        echo "::group::Gerar Summary do SCA"

        FRAG_DIR="${RUNNER_TEMP}/veracode-connect-summary"
        mkdir -p "${FRAG_DIR}"
        node "$GITHUB_ACTION_PATH/summary-findings.js" summary-md \
          "${GITHUB_WORKSPACE}/scaResults.json" \
          "${GITHUB_WORKSPACE}/scaResults.txt" \
          > "${FRAG_DIR}/sca.md"
        echo "::endgroup::"

    - name: Registrar falhas do SCA
      if: always() && env.VERACODE_CONNECT_ERROR_LOGS == 'true'
      continue-on-error: true
      shell: bash
      env:
        VC_COMPONENT: sca
        VC_STEPS: |
          veracode_sca_run=${{ steps.veracode_sca_run.outcome }}
          run_sca=${{ steps.run_sca.outcome }}
          normalize_results=${{ steps.normalize_results.outcome }}
          artifact_name=${{ steps.artifact_name.outcome }}
          upload_sca_artifact=${{ steps.upload_sca_artifact.outcome }}
          sca_summary=${{ steps.sca_summary.outcome }}
        VC_SCA_RESULT: ${{ github.workspace }}/scaResults.json
        VC_SCA_TEXT: ${{ github.workspace }}/scaResults.txt
      run: node "$GITHUB_ACTION_PATH/../error-logs/diagnostics.js" capture
