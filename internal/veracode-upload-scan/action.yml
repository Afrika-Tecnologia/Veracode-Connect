name: 'Veracode Upload & Scan'
description: 'Envia o artefato para o Veracode e inicia um Static Scan (Upload & Scan).'

inputs:
  veracode_api_id:
    description: 'ID da API do Veracode (VID).'
    required: true
  veracode_api_key:
    description: 'Key da API do Veracode (VKEY).'
    required: true
  repository_full_name:
    description: 'Repositório org/repo usado como appname no Veracode.'
    required: true
  veracode_sandbox:
    description: 'Sandbox do Upload & Scan: true, false ou vazio (auto — default branch sem sandbox, demais branches com sandbox).'
    required: false
    default: ''
  veracode_sandbox_name:
    description: 'Nome da sandbox (sandboxname na action Veracode). Obrigatório quando veracode_sandbox=true; em auto, opcional (fallback "{branch} - {appname}").'
    required: false
    default: ''
  filepath:
    description: 'Caminho do arquivo .zip a ser enviado para o Veracode (mesmo artefato do Pipeline Scan).'
    required: true
  veracode_appname:
    description: 'Nome do app no Veracode.'
    required: false
    default: '${{ github.repository }}'
  platform_type:
    description: 'CLOUD (github.com) ou ENTERPRISE (GHES).'
    required: false
    default: 'CLOUD'

outputs:
  artifact_name:
    description: 'Nome do arquivo .zip enviado ao Veracode.'
    value: ${{ steps.resolve_filepath.outputs.artifact_name }}
  artifact_size:
    description: 'Tamanho legível do artefato enviado.'
    value: ${{ steps.resolve_filepath.outputs.artifact_size }}
  sandbox_name:
    description: 'Nome da sandbox calculada (vazio se sandbox desativada).'
    value: ${{ steps.vars.outputs.sandbox_name }}
  enable_sandbox:
    description: 'Sandbox ativa (true/false).'
    value: ${{ steps.vars.outputs.enable_sandbox }}

runs:
  using: 'composite'
  steps:
    - name: Calcular nome do sandbox e URL do repositório
      id: vars
      shell: bash
      env:
        SANDBOX_INPUT: ${{ inputs.veracode_sandbox }}
        SANDBOX_NAME_INPUT: ${{ inputs.veracode_sandbox_name }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        APP_NAME: ${{ inputs.veracode_appname }}
        REPOSITORY_FULL_NAME: ${{ inputs.repository_full_name }}
      run: |
        set -euo pipefail

        echo "::group::Veracode Upload & Scan (preparação)"
        branch="${HEAD_REF:-$REF_NAME}"
        if [ -z "${branch}" ]; then
          branch="unknown"
        fi

        default_branch="${DEFAULT_BRANCH:-main}"

        if [ -n "${SANDBOX_INPUT}" ] && [ "${SANDBOX_INPUT}" != "true" ] && [ "${SANDBOX_INPUT}" != "false" ]; then
          echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error SANDBOX_INVALID)"
          echo "::endgroup::"
          exit 1
        fi

        if [ "${SANDBOX_INPUT}" = "true" ]; then
          enable_sandbox="true"
          sandbox_mode="explicit"
        elif [ "${SANDBOX_INPUT}" = "false" ]; then
          enable_sandbox="false"
          sandbox_mode="explicit"
        else
          sandbox_mode="auto"
          if [ "${branch}" = "${default_branch}" ]; then
            enable_sandbox="false"
          else
            enable_sandbox="true"
          fi
        fi

        sandbox_name=""
        if [ "${enable_sandbox}" = "true" ]; then
          if [ -n "${SANDBOX_NAME_INPUT:-}" ]; then
            sandbox_name="$(printf '%s' "${SANDBOX_NAME_INPUT}" | cut -c1-80)"
          else
            sandbox_name="${branch} - ${APP_NAME}"
            sandbox_name="$(printf '%s' "${sandbox_name}" | cut -c1-80)"
          fi
          if [ -z "${sandbox_name}" ]; then
            echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error SANDBOX_NAME_REQUIRED)"
            echo "::endgroup::"
            exit 1
          fi
        fi

        git_repository_url="${GITHUB_SERVER_URL}/${REPOSITORY_FULL_NAME}"
        git_repository_url="${git_repository_url%.git}"

        echo "sandbox_name=${sandbox_name}" >> "$GITHUB_OUTPUT"
        echo "enable_sandbox=${enable_sandbox}" >> "$GITHUB_OUTPUT"
        echo "sandbox_mode=${sandbox_mode}" >> "$GITHUB_OUTPUT"
        echo "git_repository_url=${git_repository_url}" >> "$GITHUB_OUTPUT"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success PREP_OK "sandbox=${enable_sandbox}" "mode=${sandbox_mode}" "branch=${branch}")"
        if [ -n "${sandbox_name}" ]; then
          echo "sandboxname=${sandbox_name}"
        fi
        echo "URL do repositório Git: \"${git_repository_url}\""
        echo "::endgroup::"

    - name: Resolver filepath absoluto
      id: resolve_filepath
      shell: bash
      env:
        INPUT_FILEPATH: ${{ inputs.filepath }}
      run: |
        set -euo pipefail
        echo "::group::Resolver filepath absoluto"

        if [[ "${INPUT_FILEPATH}" = /* ]]; then
          ABS_PATH="${INPUT_FILEPATH}"
        else
          ABS_PATH="${GITHUB_WORKSPACE}/${INPUT_FILEPATH}"
        fi

        if [ ! -f "${ABS_PATH}" ]; then
          echo "::error::$(node "$GITHUB_ACTION_PATH/messages.js" error FILEPATH_NOT_FOUND "path=${ABS_PATH}")"
          echo "::endgroup::"
          exit 1
        fi

        # veracode/uploadandscan-action (src/services/scan-service.js uploadFile):
        # - se filepath for ARQUIVO: passa o path direto ao Java wrapper (caminho esperado)
        # - se for DIRETÓRIO: faz readdir e concatena filepath+file SEM barra
        #   (bug upstream: sem "/" no fim vira ".veracode-uploadveracode-scan.zip")
        # Docs/exemplos da Veracode usam arquivo: filepath: 'app.zip' | 'app/target/app.war'
        echo "filepath=${ABS_PATH}" >> "$GITHUB_OUTPUT"
        echo "artifact_path=${ABS_PATH}" >> "$GITHUB_OUTPUT"
        echo "artifact_name=$(basename "${ABS_PATH}")" >> "$GITHUB_OUTPUT"
        echo "artifact_size=$(du -h "${ABS_PATH}" | cut -f1)" >> "$GITHUB_OUTPUT"
        echo "$(node "$GITHUB_ACTION_PATH/messages.js" success FILEPATH_RESOLVED "path=${ABS_PATH}")"
        echo "::endgroup::"

    - name: Veracode Upload & Scan
      id: upload_and_scan
      uses: veracode/uploadandscan-action@d2deb5741e4216f9b3bcc0cd565c1716c6cc57d2 # v0.2.3
      with:
        vid: ${{ inputs.veracode_api_id }}
        vkey: ${{ inputs.veracode_api_key }}
        appname: '${{ inputs.veracode_appname }}'
        createprofile: 'true'
        filepath: ${{ steps.resolve_filepath.outputs.filepath }}
        version: 'Scan via Veracode Connect: ${{ github.server_url }}/${{ inputs.repository_full_name }} - ${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}'
        createsandbox: ${{ steps.vars.outputs.enable_sandbox }}
        sandboxname: ${{ steps.vars.outputs.sandbox_name }}
        deleteincompletescan: 'true'
        failbuild: 'false'
        gitRepositoryUrl: ${{ steps.vars.outputs.git_repository_url }}
        platformType: ${{ inputs.platform_type }}

    - name: Gerar Summary do Upload & Scan
      if: always()
      shell: bash
      env:
        UPLOAD_OUTCOME: ${{ steps.upload_and_scan.outcome }}
        APP_NAME: ${{ inputs.veracode_appname }}
        SANDBOX_NAME: ${{ steps.vars.outputs.sandbox_name }}
        ENABLE_SANDBOX: ${{ steps.vars.outputs.enable_sandbox }}
        SANDBOX_MODE: ${{ steps.vars.outputs.sandbox_mode }}
        FILEPATH: ${{ steps.resolve_filepath.outputs.artifact_path }}
        GIT_REPOSITORY_URL: ${{ steps.vars.outputs.git_repository_url }}
      run: |
        set -euo pipefail
        echo "::group::Gerar Summary do Upload & Scan"

        {
          echo "### 📤 Veracode Upload & Scan"
          echo ""

          FILE_NAME="N/A"
          FILE_SIZE="N/A"
          if [ -n "${FILEPATH:-}" ] && [ -f "${FILEPATH}" ]; then
            FILE_NAME=$(basename "${FILEPATH}")
            FILE_SIZE=$(du -h "${FILEPATH}" | cut -f1)
          fi

          echo "| Propriedade | Valor |"
          echo "|---|---|"
          echo "| App Name | \`${APP_NAME}\` |"
          echo "| Git Repository URL | \`${GIT_REPOSITORY_URL}\` |"
          if [ "${ENABLE_SANDBOX}" = "true" ]; then
            echo "| Sandbox | \`${SANDBOX_NAME}\` (modo: ${SANDBOX_MODE}) |"
          else
            echo "| Sandbox | Desativado — app principal (modo: ${SANDBOX_MODE}) |"
          fi
          echo "| Artefato | \`${FILE_NAME}\` |"
          echo "| Tamanho | ${FILE_SIZE} |"
          echo "| Status | ${UPLOAD_OUTCOME} |"

          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        echo "Summary do Upload & Scan gerado com sucesso."
        echo "::endgroup::"